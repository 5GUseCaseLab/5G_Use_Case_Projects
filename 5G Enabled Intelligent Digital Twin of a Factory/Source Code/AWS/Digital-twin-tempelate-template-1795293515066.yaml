        \ API.\\n\\n## Input Parameters\\n* AutomationAssumeRole: (Required) The ARN\
        \ of the role that allows Automation to perform the actions on your behalf.\\\
        n* FunctionName: (Required) The AWS Lambda function name.\\n* SubnetIds: (Required)\
