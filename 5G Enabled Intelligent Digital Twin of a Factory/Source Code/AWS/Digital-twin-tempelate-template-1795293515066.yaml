      VersionName: "AWSQuickStarts-AWS-Managed-Microsoft-AD-2023-02-17-15-40-21"
      Content: "{\n  \"schemaVersion\" : \"1.0\",\n  \"description\" : \"This template\
        \ creates a VPC infrastructure for a multi-AZ, multi-tier deployment of a\
        \ Windows based Application infrastructure. It deploys a managed Microsoft\
        \ AD Directory Service into private subnets in separate Availability Zones\
        \ inside a VPC, as well as Remote Desktop Gateway instances and managed NAT\
        \ gateways into the public subnet for each Availability Zone. The default\
        \ Domain Administrator user is 'admin'.  For adding members to the domain,\
        \ ensure that they are launched into the domain member security group created\
        \ by this template and then configure them to use the AD instances fixed private\
        \ IP addresses as the DNS server. **WARNING** This template creates Amazon\
        \ EC2 Windows instance and related resources. You will be billed for the AWS\
        \ resources used if you create a stack from this template. (qs-1rtnidq31)\"\
        ,\n  \"templateBody\" : {\n    \"AWSTemplateFormatVersion\" : \"2010-09-09\"\
        ,\n    \"Description\" : \"This template creates a VPC infrastructure for\
        \ a multi-AZ, multi-tier deployment of a Windows based Application infrastructure.\
