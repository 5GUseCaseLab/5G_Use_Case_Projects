        \" | \\n    grep -Ev \\\"^(patterns|exclude_pattern)=\\\"\\n}\\n\\nWATCHDOG_PID_FILE=\\\
        \"/tmp/fis-watchdog-$$.pid\\\"\\n\\nlaunch_rollback_watchdog() {\\n    setsid\
