    Properties:
      DocumentType: "Automation"
      DocumentFormat: "YAML"
      Content: "{\n  \"description\" : \"This document is intended as a template for\
        \ an incident response runbook in [Incident Manager](https://docs.aws.amazon.com/incident-manager/latest/userguide/index.html).\\\
        n\\nFor optimal use, create your own automation document by copying the contents\
        \ of this runbook template and customizing it for your scenario. Then, navigate\
        \ to your [Response Plan](https://console.aws.amazon.com/systems-manager/incidents/response-plans/home)\
        \ and associate it with your new automation document; your runbook is automatically\
        \ started when an incident is created with the associated response plan. For\
        \ more information, see [Incident Manager - Runbooks](https://docs.aws.amazon.com/incident-manager/latest/userguide/runbooks.html).\
        \ \\u000B\\n\\nSuggested customizations include:\\n* Updating the text in\
        \ each step to provide specific guidance and instructions, such as commands\
        \ to run or links to relevant dashboards\\n* Automating actions before triage\
        \ or diagnosis to gather additional telemetry or diagnostics using aws:executeAwsApi\\\
        n* Automating actions in mitigation using aws:executeAutomation, aws:executeScript,\
        \ or aws:invokeLambdaFunction\\n\",\n  \"schemaVersion\" : \"0.3\",\n  \"\
        mainSteps\" : [ {\n    \"name\" : \"Triage\",\n    \"action\" : \"aws:pause\"\
        ,\n    \"inputs\" : { },\n    \"description\" : \"**Determine customer impact**\\\
        n\\n* View the **Metrics** tab of the incident or navigate to your [CloudWatch\
        \ Dashboards](https://console.aws.amazon.com/cloudwatch/home#dashboards:)\
        \ to find key performance indicators (KPIs) that show the extent of customer\
        \ impact. \\n* Use [CloudWatch Synthetics](https://console.aws.amazon.com/cloudwatch/home#synthetics:)\
        \ and [Contributor Insights](https://console.aws.amazon.com/cloudwatch/home#contributorinsights:)\
        \ to identify real-time failures in customer workflows. \\n\\n**Communicate\
        \ customer impact**\\n\\nUpdate the following fields to accurately describe\
        \ the incident:\\n* **Title** - The title should be quickly recognizable by\
        \ the team and specific to the particular incident.\\n* **Summary** - The\
        \ summary should contain the most important and up-to-date information to\
        \ quickly onboard new responders to the incident.\\n* **Impact** - Select\
        \ one of the following impact ratings to describe the incident:\\n  * 1 ?\
        \ Critical impact, full application failure that impacts many to all customers.\\\
        n  * 2 ? High impact, partial application failure with impact to many customers.\\\
        n  * 3 ? Medium impact, the application is providing reduced service to many\
        \ customers.\\n  * 4 ? Low impact, the application is providing reduced service\
        \ to few customers.\\n  * 5 ? No impact, customers are not currently impacted\
        \ but urgent action is needed to avoid impact.\"\n  }, {\n    \"name\" : \"\
        Diagnosis\",\n    \"action\" : \"aws:pause\",\n    \"inputs\" : { },\n   \
        \ \"description\" : \"**Rollback**  \\n\\n* Look for recent changes to the\
        \ production environment that might have caused the incident. Engage the responsible\
        \ team using the **Contacts** tab of the incident.\\n* Rollback these changes\
        \ if possible.\\n\\n**Locate failures**  \\n* Review metrics and alarms related\
        \ to your [Application](https://console.aws.amazon.com/systems-manager/appmanager/applications).\
        \ Add any related metrics and alarms to the **Metrics** tab of the incident.\\\
        n* Use [CloudWatch ServiceLens](https://console.aws.amazon.com/cloudwatch/home#servicelens:)\
        \ to troubleshoot issues across multiple services.\\n* Investigate the possibility\
        \ of ongoing incidents across your organization. Check for known incidents\
        \ and issues in AWS using [Personal Health Dashboard](https://console.aws.amazon.com/systems-manager/insights).\
        \ Add related links to the **Related Items** tab of the incident. \\n* Avoid\
        \ going too deep in diagnosing the failure and focus on how to mitigate the\
        \ customer impact. Update the **Timeline** tab of the incident when a possible\
        \ diagnosis is identified. \\n\"\n  }, {\n    \"name\" : \"Mitigation\",\n\
        \    \"action\" : \"aws:pause\",\n    \"description\" : \"**Collaborate**\
        \  \\n* Communicate any changes or important information from the previous\
        \ step to the members of the associated chat channel for this incident. Ask\
        \ for input on possible ways to mitigate customer impact.\\n* Engage additional\
        \ contacts or teams using their escalation plan from the **Contacts** tab.\\\
        n* If necessary, prepare an emergency change request in [Change Manager](https://console.aws.amazon.com/systems-manager/change-manager).\\\
        n\\n**Implement mitigation**  \\n* Consider re-routing customer traffic or\
        \ throttling incoming requests to reduce customer impact. \\n* Look for common\
        \ runbooks in [Automation](https://console.aws.amazon.com/systems-manager/automation)\
        \ or run commands using [Run Command](https://.console.aws.amazon.com/systems-manager/run-command).\\\
        n* Update the **Timeline** tab of the incident when a possible mitigation\
        \ is identified. If needed, review the mitigation with others in the associated\
        \ chat channel before proceeding.  \",\n    \"inputs\" : { }\n  }, {\n   \
        \ \"name\" : \"Recovery\",\n    \"action\" : \"aws:pause\",\n    \"inputs\"\
        \ : { },\n    \"description\" : \"**Monitor customer impact**\\n* View the\
        \ **Metrics** tab of the incident to monitor for recovery of your key performance\
        \ indicators (KPIs).\\n* Update the **Impact** field in the incident when\
        \ customer impact has been reduced or resolved. \\n\\n**Identify action items**\
        \  \\n* Add entries in the **Timeline** tab of the incident to record key\
        \ decisions and actions taken, including temporary mitigations that might\
        \ have been implemented. \\n* Create a **Post-Incident Analysis** when the\
        \ incident is closed in order to identify and track action items in [OpsCenter](https://console.aws.amazon.com/systems-manager/opsitems).\
        \ \"\n  } ]\n}"
      Tags: []
      Name: "AWSIncidents-CriticalIncidentRunbookTemplate"
  SSMDocumentAWSFISRunNetworkLatencyECS:
    UpdateReplacePolicy: "Retain"
    Type: "AWS::SSM::Document"
    DeletionPolicy: "Retain"
    Properties:
      DocumentType: "Command"
      DocumentFormat: "YAML"
      Content: "{\n  \"description\" : \"### Document name - AWSFIS-Run-Network-Latency-ECS\\\
        n\\n## What does this document do?\\nIt adds latency with jitter to the network\
        \ traffic, using the ECS fault injection endpoints.\\nThis SSM document supports\
        \ Amazon Linux and Ubuntu operating systems only.\\n\\n## Dependencies installed\
        \ by this SSM Document\\n* setsid\\n* curl\\n* dig\\n* jq\\n* lsof\\n* pgrep\\\
        nNote: This SSM document does not uninstall dependencies once installed. If\
        \ you don't want this SSM document to install any dependencies, set InstallDependencies\
        \ to False and bake the dependencies into your EC2 instance. For example,\
        \ by using image-builder (https://aws.amazon.com/image-builder/).\\n\\n##\
        \ Input Parameters\\n* FISActionState: The FIS-populated action state JSON.\\\
        n* Sources: (Required) The sources, separated by commas, without spaces. The\
        \ possible values are: an IPv4 address, an IPv4 CIDR block, a domain name,\
        \ an AZ name (us-east-1a), an AZ ID (use1-az1), ALL, DYNAMODB, and S3. The\
        \ default is ALL, which matches all IPv4 traffic.\\n* DelayMilliseconds: The\
        \ delay - in milliseconds - to add to the interface (default: 200).\\n* JitterMilliseconds:\
        \ The jitter -  in milliseconds - to add to the delay (default: 10).\\n* DurationSeconds:\
        \ (Required) The duration - in seconds - of the fault injection.\\n* InstallDependencies:\
        \ If set to True, Systems Manager installs the required dependencies on the\
        \ target instances (default: True).\\n* FlowsPercent: The percentage of network\
        \ flows that will be affected by the action. The default is 100%.\\n\\n##\
        \ Output Parameters\\nNone.\",\n  \"schemaVersion\" : \"2.2\",\n  \"parameters\"\
        \ : {\n    \"FISActionState\" : {\n      \"type\" : \"String\",\n      \"\
        description\" : \"The FIS-populated action state JSON.\",\n      \"allowedPattern\"\
        \ : \"^\\\\{\\\"id\\\":\\\"[^'\\\\r\\\\n]+\\\",\\\"callTime\\\":\\\\d{10},\\\
        \"callCount\\\":\\\\d+}$\"\n    },\n    \"Sources\" : {\n      \"type\" :\
        \ \"String\",\n      \"description\" : \"(Required) The sources, separated\
        \ by commas, without spaces. The possible values are: an IPv4 address, an\
        \ IPv4 CIDR block, a domain name, an AZ name (us-east-1a), an AZ ID (use1-az1),\
        \ ALL, DYNAMODB, and S3. The default is ALL, which matches all IPv4 traffic.\"\
        ,\n      \"allowedPattern\" : \"^[0-9a-zA-Z./,-]+$\"\n    },\n    \"DelayMilliseconds\"\
        \ : {\n      \"type\" : \"String\",\n      \"description\" : \"The delay -\
        \ in milliseconds - to add to the interface (default: 200).\",\n      \"default\"\
        \ : \"200\",\n      \"allowedPattern\" : \"^[0-9]+$\"\n    },\n    \"JitterMilliseconds\"\
        \ : {\n      \"type\" : \"String\",\n      \"description\" : \"The jitter\
        \ -  in milliseconds - to add to the delay (default: 10).\",\n      \"default\"\
        \ : \"10\",\n      \"allowedPattern\" : \"^[0-9]+$\"\n    },\n    \"DurationSeconds\"\
        \ : {\n      \"type\" : \"String\",\n      \"description\" : \"(Required)\
        \ The duration - in seconds - of the fault injection.\",\n      \"allowedPattern\"\
        \ : \"^[0-9]+$\"\n    },\n    \"InstallDependencies\" : {\n      \"type\"\
        \ : \"String\",\n      \"description\" : \"If set to True, Systems Manager\
        \ installs the required dependencies on the target instances (default: True).\"\
        ,\n      \"default\" : \"True\",\n      \"allowedValues\" : [ \"True\", \"\
        False\" ]\n    },\n    \"FlowsPercent\" : {\n      \"type\" : \"String\",\n\
        \      \"description\" : \"The percentage of network flows that will be affected\
        \ by the action. The default is 100%.\",\n      \"default\" : \"100\",\n \
        \     \"allowedPattern\" : \"^([1-9][0-9]?|100)$\"\n    }\n  },\n  \"mainSteps\"\
        \ : [ {\n    \"action\" : \"aws:runShellScript\",\n    \"name\" : \"InstallDependencies\"\
        ,\n    \"precondition\" : {\n      \"StringEquals\" : [ \"platformType\",\
        \ \"Linux\" ]\n    },\n    \"description\" : \"## Parameter: InstallDependencies\\\
        nIf set to True, this step installs the required dependency via operating\
        \ system's repository. It supports both\\nDebian (apt) and CentOS (yum) based\
        \ package managers.\",\n    \"inputs\" : {\n      \"onFailure\" : \"exit\"\
        ,\n      \"runCommand\" : [ \"#!/bin/bash\\n\\nset -o errexit\\n\\n# Check\
        \ if dependencies are already installed\\ncheck_existing_dependencies() {\\\
        n  if [[ \\\"$( command -v setsid 2>/dev/null )\\\" && \\\"$( command -v curl\
        \ 2>/dev/null )\\\" && \\\"$( command -v dig 2>/dev/null )\\\" && \\\"$( command\
        \ -v jq 2>/dev/null )\\\" && \\\"$( command -v lsof 2>/dev/null )\\\" && \\\
        \"$( command -v pgrep 2>/dev/null )\\\" ]]; then\\n    echo \\\"Dependencies\
        \ are already installed.\\\"\\n    exit\\n  fi\\n}\\n\\nvalidate_installation_settings()\
        \ {\\n  if [[ \\\"{{ InstallDependencies }}\\\" == False ]]; then\\n    echo\
        \ \\\"Missing dependencies detected with InstallDependencies set to false.\
        \ Please install dependencies [\\\"setsid\\\", \\\"curl\\\", \\\"dig\\\",\
        \ \\\"jq\\\", \\\"lsof\\\", \\\"pgrep\\\"] or set InstallDependencies to true\
        \ for supported operating systems.\\\" >&2\\n    exit 1\\n  fi\\n}\\n\\nmain()\
        \ {\\n  check_existing_dependencies\\n  validate_installation_settings\\n\
        \  echo \\\"Installing required dependencies\\\"\\n  trap 'status=$?; if [\
        \ $status -eq 1 ]; then echo \\\"Failed to install dependencies. Please retry\
        \ or manually install dependencies [\\\"setsid\\\", \\\"curl\\\", \\\"dig\\\
        \", \\\"jq\\\", \\\"lsof\\\", \\\"pgrep\\\"] and set InstallDependencies to\
        \ false.\\\" >&2; fi' EXIT\\n\\n\\n  yum -y install util-linux curl-minimal\
        \ bind-utils jq lsof procps-ng\\n}\\n\\nmain\\n\" ]\n    }\n  }, {\n    \"\
        action\" : \"aws:runShellScript\",\n    \"name\" : \"FaultInjection\",\n \
        \   \"precondition\" : {\n      \"StringEquals\" : [ \"platformType\", \"\
        Linux\" ]\n    },\n    \"description\" : \"# Parameters: Sources, FlowsPercent,\
        \ DelayMilliseconds, JitterMilliseconds and DurationSeconds\\nThis step starts\
        \ by extracting the IP for all the `Sources` provided and adds a `DelayMilliseconds`\
        \ with `JitterMilliseconds` delay for the given `DurationSeconds`, affecting\
        \ only `FlowsPercent` of network flows, using the ECS fault injection endpoints.\\\
        nIt has two rollback mechanisms in place:\\n- It will listen for exit signals\
        \ (SIGINT and SIGTERM), and will stop the fault injection if any of them is\
        \ received.\\n- It will periodically enqueue rollback checks as background\
        \ processes. This way, if the command is stopped and the rollback was not\
        \ executed, the enqueued commands will try to stop it. (for example, if the\
        \ command is stopped using kill -9).\\nThis is just an extra safety check\
        \ to avoid having the latency remain injected after the script is no longer\
        \ running.\\nThis document is also executed in heartbeat mode: every 20 seconds,\
        \ FIS will update a file with the ?last update? timestamp. If for any reason\
        \ FIS stops updating that file, the document will assume that something is\
        \ wrong with FIS and the fault will be stopped after 60 seconds.\",\n    \"\
        inputs\" : {\n      \"maxAttempts\" : 1,\n      \"timeoutSeconds\" : 43200,\n\
        \      \"runCommand\" : [ \"#!/bin/bash\\nset -o errexit -o errtrace -o nounset\
        \ -o pipefail\\n\\n########################\\n# Function definitons  #\\n########################\\\
        n\\nforce_dns() {\\n  local -r hostname=\\\"$1\\\"    # Hostname is expected\
        \ as first argument\\n  local -ar ips=(\\\"${@:2}\\\")  # The rest will be\
        \ the IPs\\n\\n  if [ -f \\\"/etc/fis/.no-force-dns\\\" ]; then\\n    echo\
        \ \\\"WARNING: Running in non-root mode and cannot write to ${HOSTS_FILE:-/etc/hosts}.\
        \ DNS pinning for $hostname will be skipped.\\\" >&2\\n    return 0\\n  fi\\\
        n\\n  # Force any new DNS resolution for that host to the latest known IPs\\\
        n  for ip in \\\"${ips[@]}\\\"; do\\n    echo \\\"$ip $hostname ${DELETE_MSG:-\\\
        \"#delete-after-fault-injection\\\"}\\\" >> \\\"${HOSTS_FILE:-/etc/hosts}\\\
        \"\\n  done\\n\\n  return 0\\n}\\n\\nget_ips_from_input() {\\n  local -r input=\\\
        \"$1\\\"\\n  local -r regex=\\\"$2\\\"\\n\\n  # Echoes the input and returns\
        \ 0 if the input is valid, otherwise returns 1\\n  local -r validated_input=$(grep\
        \ -E \\\"$regex\\\" <<< \\\"$input\\\")\\n  [ -z \\\"$validated_input\\\"\
        \ ] || { echo \\\"$validated_input\\\" ; return 0 ;}\\n\\n  return 1\\n}\\\
        n\\nget_ips_from_dns() {\\n  local -r domain=\\\"$1\\\"\\n  local -a resolved_ips=()\\\
        n\\n  # Echoes IPs of the domain and forces DNS resolution to the IPs then\
        \ returns 0, otherwise returns 1\\n  # Since `dig` can return different IPs,\
        \ we call it 10 times to maximize the chances of covering as many IPs as possible\
        \ for the provided domain\\n  for _ in {1..10}\\n    do\\n      local -a dig_output=(\
        \ $(dig +short \\\"$domain\\\" | grep -v '[[:alpha:]]') )\\n      [ ${#dig_output[@]}\
        \ -eq 0 ] || resolved_ips+=(\\\"${dig_output[@]}\\\")\\n    done\\n\\n  if\
        \ [ ${#resolved_ips[@]} -gt 0 ]; then\\n    local -ar unique_resolved_ips=(\
        \ $(printf '%s\\\\n' \\\"${resolved_ips[@]}\\\" | sort -u) )\\n    [ ${#unique_resolved_ips[@]}\
        \ -eq 0 ] || { echo \\\"${unique_resolved_ips[@]}\\\" ; force_dns \\\"$domain\\\
        \" \\\"${unique_resolved_ips[@]}\\\" ; return 0 ;}\\n  fi\\n\\n  return 1\\\
        n}\\n\\nget_protected_ips_from_protected_endpoints() {\\n  local get_ips=\\\
        \"$1\\\"\\n  local -ar endpoints=(\\\"${@:2}\\\")\\n\\n  for e in \\\"${endpoints[@]}\\\
        \"; do\\n    local ips_output=$(eval \\\"get_ips \\\\\\\"$e\\\\\\\"\\\")\\\
        n    if [[ -n \\\"$ips_output\\\" ]]; then\\n      local -a ips=()\\n    \
        \  read -ra ips <<< \\\"$ips_output\\\"\\n      PROTECTED_IPS+=(\\\"${ips[@]}\\\
        \")\\n    fi\\n  done\\n\\n  return 0\\n}\\n\\nget_protected_ips_from_ssm_connections()\
        \ {\\n  local -r regex=\\\"$1\\\"\\n\\n  if pgrep ssm > /dev/null; then\\\
        n    local -r ssm_connections=( $(lsof -a -nPi4 -c /ssm/ -Fn | awk '$1 ~ /^n/'\
        \ | awk -F'->' '{print $2}' | awk -F':' '{print $1}' | awk \\\"/$regex/\\\"\
        \ | awk NF) )\\n    [ ${#ssm_connections[@]} -eq 0 ] || PROTECTED_IPS+=(\\\
        \"${ssm_connections[@]}\\\")\\n  fi\\n\\n  return 0\\n}\\n\\nget_sorted_unique_protected_ips()\
        \ {\\n  if [ ${#PROTECTED_IPS[@]} -gt 0 ]; then\\n    PROTECTED_IPS=($(for\
        \ ip in \\\"${PROTECTED_IPS[@]}\\\"; do echo \\\"${ip}\\\"; done | sort -u))\\\
        n  fi\\n\\n  return 0\\n}\\n\\n# Get the REGION of the instance\\nEC2_REGION=$AWS_SSM_REGION_NAME\\\
        n\\nIP_CIDR_REGEX=\\\"^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\\\
        \\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])(\\\\/(3[0-2]|[1-2][0-9]|[0-9]))$\\\
        \"\\n\\nIP_REGEX=\\\"^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\\\\\
        .){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])$\\\"\\n\\nDELETE_MSG=\\\
        \"#delete-after-fault-injection\\\"\\n\\n# Endpoints we want to preserve (SSM\
        \ API)\\nSSMMESSAGES_ENDPOINT_IPV4=ssmmessages.$AWS_SSM_REGION_NAME.amazonaws.com\\\
        nSSM_ENDPOINT_IPV4=ssm.$AWS_SSM_REGION_NAME.amazonaws.com\\nEC2MESSAGES_ENDPOINT_IPV4=ec2messages.$AWS_SSM_REGION_NAME.amazonaws.com\\\
        nSSMMESSAGES_ENDPOINT_DUALSTACK=ssmmessages.$AWS_SSM_REGION_NAME.api.aws\\\
        nSSM_ENDPOINT_DUALSTACK=ssm.$AWS_SSM_REGION_NAME.api.aws\\n\\nPROTECTED_ENDPOINTS=(\\\
        n  \\\"${SSMMESSAGES_ENDPOINT_IPV4}\\\"\\n  \\\"${SSM_ENDPOINT_IPV4}\\\"\\\
        n  \\\"${EC2MESSAGES_ENDPOINT_IPV4}\\\"\\n  \\\"${SSMMESSAGES_ENDPOINT_DUALSTACK}\\\
        \"\\n  \\\"${SSM_ENDPOINT_DUALSTACK}\\\"\\n)\\n\\nget_target_ips_from_sources()\
        \ {\\n  local get_ips=\\\"$1\\\"\\n  local sources=\\\"$2\\\"\\n\\n  # Check\
        \ if ANY source is \\\"ALL\\\" - short circuit to target all traffic\\n  for\
        \ source in ${sources//,/ }; do\\n    if [[ \\\"$source\\\" == \\\"ALL\\\"\
        \ ]]; then\\n      TARGET_IPS=(\\\"0.0.0.0/0\\\")\\n      echo \\\"Target\
        \ IPs and ranges: ${TARGET_IPS[*]} (targeting all traffic)\\\"\\n      return\
        \ 0\\n    fi\\n  done\\n\\n  # Prepares the sources and get IPs for all of\
        \ them\\n  local -a invalid_sources=()\\n  for source in ${sources//,/ };\
        \ do\\n    ips=$(eval \\\"get_ips \\\\\\\"$source\\\\\\\"\\\")\\n    if [\
        \ -n \\\"$ips\\\" ]; then\\n      for ip in ${ips[*]}; do\\n        TARGET_IPS+=(\\\
        \"${ip}\\\")\\n      done\\n    else\\n      invalid_sources+=(\\\"${source}\\\
        \")\\n    fi\\n  done\\n\\n  if [ ${#invalid_sources[@]} -gt 0 ]; then\\n\
        \    echo \\\"Invalid sources (malformed service name, DNS or IP address):\
        \ ${invalid_sources[*]}\\\" >&2\\n    exit 1\\n  fi\\n\\n  echo \\\"Target\
        \ IPs and ranges: ${TARGET_IPS[*]}\\\"\\n\\n  return 0\\n}\\n\\nget_ips_from_aws_service()\
        \ {\\n  local -r input=\\\"$1\\\"\\n  local -r ip_range_url=\\\"$2\\\"\\n\
        \  local -r ec2_region=\\\"$3\\\"\\n\\n  # Only accepting DYNAMODB and S3\
        \ from ip-range service\\n  if [[ \\\"$input\\\" =~ ^(\\\"DYNAMODB\\\"|\\\"\
        S3\\\")$ ]]; then\\n    # Echoes IPs of the Service\\n    curl -s \\\"${ip_range_url}\\\
        \" --connect-timeout 5 | jq -r '.prefixes[] | select(.region==\\\"'$ec2_region'\\\
        \") | select(.service==\\\"'$input'\\\") | .ip_prefix'\\n  fi\\n}\\n\\nadd_tmds_ip_to_protected_endpoints()\
        \ {\\n  local -r ecs_agent_url=\\\"$1\\\" \\n\\n  # Extracts IP from ECS agent\
        \ URL using 'cut' with forward slash delimiter (-d \\\"/\\\") and selecting\
        \ third field (-f 3)\\n  # \\n  # Example:\\n  # http://169.254.170.2/api/59d3b9b8bb55476488cee0122ea98da3-0949121929\\\
        n  #\\n  # [1] http:\\n  # [2] *blank\\n  # [3] 169.254.170.2\\n  # [4] v1\\\
        n  # [5] metadata\\n  # \\n  # tmds_ip will be \\\"169.254.170.2\\\"\\n  local\
        \ -r tmds_ip=$(echo \\\"${ecs_agent_url}\\\" | cut -d \\\"/\\\" -f 3)\\n \
        \ echo \\\"Adding ECS task metadata IP: ${tmds_ip} to PROTECTED_ENDPOINTS\\\
        \"\\n  PROTECTED_ENDPOINTS+=(\\\"${tmds_ip}\\\")\\n\\n  return 0\\n}\\n\\\
        nenable_fault_ecs() {\\n  # Call the ECS Agent start fault injection API\\\
        n  local -r curl_response=$(curl -s -X POST \\\"${ECS_AGENT_URI}/fault/v1/$FAULT_TYPE/start\\\
        \" \\\\\\n    -H 'Content-Type: application/json' \\\\\\n    -d \\\"$JSON_PAYLOAD\\\
        \" \\\\\\n    --write-out '#%{response_code}')\\n\\n  echo \\\"curl -s -X\
        \ POST ${ECS_AGENT_URI}/fault/v1/$FAULT_TYPE/start -H 'Content-Type: application/json'\
        \ -d '$JSON_PAYLOAD' --write-out '#%{response_code}'\\\"\\n  echo \\\"$curl_response\\\
        \"\\n  \\n  local -r status_code=$(echo \\\"$curl_response\\\" | cut -d \\\
        \"#\\\" -f 2)\\n  if [[ $status_code -ge 400 ]]; then\\n    echo \\\"There\
        \ was an error starting the fault injection.\\\";\\n\\n    if ! grep -q \\\
        \"${DELETE_MSG:-#delete-after-fault-injection}\\\" \\\"${HOSTS_FILE:-/etc/hosts}\\\
        \" 2>/dev/null; then\\n      echo \\\"No fault-injected entries found in hosts\
        \ file, skipping restore\\\"\\n    else\\n      local mutated_hosts_file\\\
        n      mutated_hosts_file=$(mktemp)\\n\\n      if ! cp \\\"${HOSTS_FILE:-/etc/hosts}\\\
        \" \\\"$mutated_hosts_file\\\"; then\\n        echo \\\"Failed to copy current\
        \ hosts file - exiting without restoring hosts file\\\" >&2\\n        rm -f\
        \ \\\"$mutated_hosts_file\\\"\\n        rm -f \\\"$FLAG_PATH\\\" \\\"$ROLLBACK_PATH\\\
        \" \\\"$HEARTBEAT_EXPIRATION_PATH\\\" \\n        exit 1\\n      fi\\n\\n \
        \     local restored_hosts_file\\n      restored_hosts_file=$(mktemp)\\n\\\
        n      sed \\\"/${DELETE_MSG:-\\\"#delete-after-fault-injection\\\"}/d\\\"\
        \ \\\"${HOSTS_FILE:-/etc/hosts}\\\" > \\\"$restored_hosts_file\\\"\\n\\n \
        \     local actual_deleted_lines\\n      actual_deleted_lines=$(grep --invert-match\
        \ --line-regexp --fixed-strings --file=\\\"$restored_hosts_file\\\" \\\"$mutated_hosts_file\\\
        \" || true)\\n\\n      local expected_deleted_lines\\n      expected_deleted_lines=$(grep\
        \ \\\"${DELETE_MSG:-\\\"#delete-after-fault-injection\\\"}\\\" \\\"$mutated_hosts_file\\\
        \" || true)\\n\\n      if [ \\\"$actual_deleted_lines\\\" != \\\"$expected_deleted_lines\\\
        \" ]; then\\n        echo \\\"sed operation produced unexpected results -\
        \ exiting without restoring hosts file\\\" >&2\\n        echo \\\"Before sed\
        \ operation:\\\" >&2\\n        cat \\\"${mutated_hosts_file}\\\" >&2\\n  \
        \      echo \\\"After sed operation:\\\" >&2\\n        cat \\\"${restored_hosts_file}\\\
        \" >&2\\n        rm -f \\\"$restored_hosts_file\\\" \\\"$mutated_hosts_file\\\
        \"\\n        rm -f \\\"$FLAG_PATH\\\" \\\"$ROLLBACK_PATH\\\" \\\"$HEARTBEAT_EXPIRATION_PATH\\\
        \"\\n        exit 1\\n      fi\\n\\n      if ! cat \\\"$restored_hosts_file\\\
        \" > \\\"${HOSTS_FILE:-/etc/hosts}\\\"; then\\n        echo \\\"Failed to\
        \ write back to hosts file\\\" >&2\\n        rm -f \\\"$restored_hosts_file\\\
        \" \\\"$mutated_hosts_file\\\"\\n        rm -f \\\"$FLAG_PATH\\\" \\\"$ROLLBACK_PATH\\\
        \" \\\"$HEARTBEAT_EXPIRATION_PATH\\\"\\n        exit 1\\n      fi\\n\\n  \
        \    local final_deleted_lines\\n      final_deleted_lines=$(grep --invert-match\
        \ --line-regexp --fixed-strings --file=\\\"${HOSTS_FILE:-/etc/hosts}\\\" \\\
        \"$mutated_hosts_file\\\" || true)\\n\\n      if [ \\\"$final_deleted_lines\\\
        \" != \\\"$expected_deleted_lines\\\" ]; then\\n        echo \\\"Hosts file\
        \ restore verification failed after write-back to hosts file\\\" >&2\\n  \
        \      echo \\\"Mutated file content:\\\" >&2\\n        cat \\\"${mutated_hosts_file}\\\
        \" >&2\\n        echo \\\"Before write-back operation:\\\" >&2\\n        cat\
        \ \\\"${restored_hosts_file}\\\" >&2\\n        echo \\\"After write-back operation:\\\
        \" >&2\\n        cat \\\"${HOSTS_FILE:-/etc/hosts}\\\" >&2\\n        rm -f\
        \ \\\"$restored_hosts_file\\\" \\\"$mutated_hosts_file\\\"\\n        rm -f\
        \ \\\"$FLAG_PATH\\\" \\\"$ROLLBACK_PATH\\\" \\\"$HEARTBEAT_EXPIRATION_PATH\\\
        \"\\n        exit 1\\n      fi\\n\\n      echo \\\"Hosts file restore completed\
        \ successfully\\\"\\n      rm -f \\\"$restored_hosts_file\\\" \\\"$mutated_hosts_file\\\
        \"\\n    fi\\n\\n    rm -f \\\"$FLAG_PATH\\\" \\\"$ROLLBACK_PATH\\\" \\\"\
        $HEARTBEAT_EXPIRATION_PATH\\\"\\n    exit 1\\n  fi\\n}\\n\\ndisable_fault_ecs()\
        \ {\\n  if ! grep -q \\\"${DELETE_MSG:-#delete-after-fault-injection}\\\"\
        \ \\\"${HOSTS_FILE:-/etc/hosts}\\\" 2>/dev/null; then\\n    echo \\\"No fault-injected\
