        \n          },\n          \"PKI\" : {\n            \"default\" : \"Deploy\
        \ PKI Infrastructure\"\n          },\n          \"PKIEnableAdvancedAudtingandMetrics\"\
        \ : {\n            \"default\" : \"Advanced Auditing and Metrics for PKI Instance(s)\"\
        \n          },\n          \"PrivateSubnet1CIDR\" : {\n            \"default\"\
        \ : \"Private Subnet 1 CIDR\"\n          },\n          \"PrivateSubnet2CIDR\"\
        \ : {\n            \"default\" : \"Private Subnet 2 CIDR\"\n          },\n\
        \          \"PrivateSubnet3CIDR\" : {\n            \"default\" : \"(Optional)\
        \ Private Subnet 3 CIDR\"\n          },\n          \"PublicSubnet1CIDR\" :\
        \ {\n            \"default\" : \"Public Subnet 1 CIDR\"\n          },\n  \
        \        \"PublicSubnet2CIDR\" : {\n            \"default\" : \"Public Subnet\
        \ 2 CIDR\"\n          },\n          \"PublicSubnet3CIDR\" : {\n          \
        \  \"default\" : \"(Optional) Public Subnet 3 CIDR\"\n          },\n     \
        \     \"QSS3BucketName\" : {\n            \"default\" : \"Quick Start S3 bucket\
        \ name\"\n          },\n          \"QSS3BucketRegion\" : {\n            \"\
        default\" : \"Quick Start S3 bucket region\"\n          },\n          \"QSS3KeyPrefix\"\
        \ : {\n            \"default\" : \"Quick Start S3 key prefix\"\n         \
        \ },\n          \"RDGWCIDR\" : {\n            \"default\" : \"Allowed Remote\
        \ Desktop Gateway External Access CIDR\"\n          },\n          \"RDGWInstanceType\"\
        \ : {\n            \"default\" : \"Remote Desktop Gateway Instance Type\"\n\
        \          },\n          \"SetupAppInsightsMonitoring\" : {\n            \"\
        default\" : \"Setup Application Insights monitoring\"\n          },\n    \
        \      \"S3CRLBucketName\" : {\n            \"default\" : \"CA CRL S3 Bucket\
        \ Name\"\n          },\n          \"UseS3ForCRL\" : {\n            \"default\"\
        \ : \"Use S3 for CA CRL Location\"\n          },\n          \"VPCCIDR\" :\
        \ {\n            \"default\" : \"VPC CIDR\"\n          }\n        }\n    \
        \  }\n    },\n    \"Parameters\" : {\n      \"ADEdition\" : {\n        \"\
        AllowedValues\" : [ \"Standard\", \"Enterprise\" ],\n        \"Default\" :\
        \ \"Enterprise\",\n        \"Description\" : \"The AWS Managed Microsoft AD\
        \ Edition you wish to deploy\",\n        \"Type\" : \"String\"\n      },\n\
        \      \"AvailabilityZones\" : {\n        \"Description\" : \"List of Availability\
        \ Zones to use for the subnets in the VPC. Note: The logical order is preserved\
        \ and only 2 AZs are used for this deployment\",\n        \"Type\" : \"List<AWS::EC2::AvailabilityZone::Name>\"\
        \n      },\n      \"CaDataDriveSizeGiB\" : {\n        \"Default\" : \"2\"\
        ,\n        \"Description\" : \"Size of the data drive in GiB for the CA instance(s)\"\
        ,\n        \"Type\" : \"Number\",\n        \"MinValue\" : \"2\",\n       \
        \ \"MaxValue\" : \"16384\"\n      },\n      \"CaHashAlgorithm\" : {\n    \
        \    \"AllowedValues\" : [ \"SHA256\", \"SHA384\", \"SHA512\" ],\n       \
        \ \"Default\" : \"SHA256\",\n        \"Description\" : \"CA(s) Hash Algorithm\
        \ for Signing Certificates\",\n        \"Type\" : \"String\"\n      },\n \
        \     \"CaKeyLength\" : {\n        \"AllowedValues\" : [ \"2048\", \"4096\"\
        \ ],\n        \"Default\" : \"2048\",\n        \"Description\" : \"CA(s) Cryptographic\
        \ Provider Key Length\",\n        \"Type\" : \"String\"\n      },\n      \"\
        CaServerInstanceType\" : {\n        \"AllowedValues\" : [ \"t3.small\", \"\
        t3.medium\", \"t3.large\", \"t3.xlarge\", \"t3.2xlarge\", \"m5.large\", \"\
        m5.xlarge\", \"m5.2xlarge\", \"m5.4xlarge\" ],\n        \"Default\" : \"t3.medium\"\
        ,\n        \"Description\" : \"Amazon EC2 instance type for the CA instance(s)\"\
        ,\n        \"Type\" : \"String\"\n      },\n      \"CaValidityPeriodUnits\"\
        \ : {\n        \"Default\" : \"5\",\n        \"Description\" : \"Validity\
        \ Period in Years\",\n        \"Type\" : \"Number\",\n        \"MinValue\"\
        \ : \"1\"\n      },\n      \"DHCPOptionSet\" : {\n        \"AllowedValues\"\
        \ : [ \"Yes\", \"No\" ],\n        \"Default\" : \"Yes\",\n        \"Description\"\
        \ : \"Do you want to create and apply a new DHCP Options Set\",\n        \"\
        Type\" : \"String\"\n      },\n      \"DomainAdminPassword\" : {\n       \
        \ \"AllowedPattern\" : \"(?=^.{8,32}$)((?=.*\\\\d)(?=.*[A-Z])(?=.*[a-z])|(?=.*\\\
        \\d)(?=.*[^A-Za-z0-9])(?=.*[a-z])|(?=.*[^A-Za-z0-9])(?=.*[A-Z])(?=.*[a-z])|(?=.*\\\
        \\d)(?=.*[A-Z])(?=.*[^A-Za-z0-9]))^.*\",\n        \"Description\" : \"Password\
