  SSMDocumentAWSSupportTroubleshootGlueConnection:
    UpdateReplacePolicy: "Retain"
    Type: "AWS::SSM::Document"
    DeletionPolicy: "Retain"
    Properties:
      TargetType: "/"
      DocumentType: "Automation"
      DocumentFormat: "JSON"
      Content: "{\n  \"description\": \"The **AWSSupport-TroubleshootGlueConnections**\
        \ runbook helps troubleshoot AWS Glue connection issues. The target of the\
        \ tested connection must be reached through a JDBC connection and can be either\
        \ an Amazon Relational Database Service (Amazon RDS) cluster/instance, an\
        \ Amazon Redshift cluster, or any other target accessible through JDBC. In\
        \ the first two cases, the reachability analyser tool is used to determine\
        \ if the connectivity between the source (AWS Glue) and the target (Amazon\
        \ RDS or Amazon Redshift ) is granted. If the target of the connection is\
        \ not Amazon RDS nor Amazon Redshift, connectivity is still tested by creating\
        \ an AWS Lambda function in the same subnet of the AWS Glue connection (a\
        \ network point of presence) and checking if the target name is resolvable\
        \ and if it's reachable in the target port. For the connectivity one, the\
        \ following checks are also performed:\\n\\n- Check if the security group\
        \ of the connection has a self referencing rule enabling in-bound connections.\\\
