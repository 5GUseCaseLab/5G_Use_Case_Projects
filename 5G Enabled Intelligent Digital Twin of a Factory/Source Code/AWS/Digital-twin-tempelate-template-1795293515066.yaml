        \"s3\\\")\\n\\n\\ndef get_bucket_notification_configuration(bucket_name: str)\
        \ -> dict:\\n    \\\"\\\"\\\"Gets the event notifications configured with\
        \ the Amazon S3 Bucket.\\n\\n    Args:\\n        bucket_name: The name of\
        \ the Amazon S3 bucket.\\n\\n    Returns:\\n        Returns the event notifications\
        \ configured with the Amazon S3 Bucket.\\n\\n    Raises:\\n        ClientError:\
        \ An error occurred calling the get_bucket_notification_configuration API.\\\
        n    \\\"\\\"\\\"\\n    try:\\n        event_notifications = s3_client.get_bucket_notification_configuration(\\\
        n            Bucket=bucket_name,\\n        )\\n        return event_notifications\\\
