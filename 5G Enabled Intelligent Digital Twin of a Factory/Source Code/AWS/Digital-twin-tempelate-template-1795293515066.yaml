        allowedPattern\" : \"^[1-9][0-9]?$|^100$\",\n      \"default\" : 100\n   \
        \ },\n    \"Mode\" : {\n      \"type\" : \"String\",\n      \"description\"\
        \ : \"(Optional) Defines the mode in which this runbook operates. The default\
        \ is Orchestrator, which automatically\\nstarts child executions in Worker\
        \ mode.\",\n      \"allowedValues\" : [ \"Orchestrator\", \"Worker\" ],\n\
        \      \"allowedPattern\" : \"^(Orchestrator|Worker)$\",\n      \"default\"\
        \ : \"Orchestrator\"\n    },\n    \"RunScriptTimeout\" : {\n      \"type\"\
        \ : \"Integer\",\n      \"description\" : \"(Optional) The time limit for\
        \ long-running executeScript steps. Reduce this this value if you experience\\\
        nstep failures.\",\n      \"allowedPattern\" : \"^([1-5]?\\\\d{1,2}|600)$\"\
        ,\n      \"default\" : 540\n    },\n    \"TargetValue\" : {\n      \"type\"\
        \ : \"String\",\n      \"description\" : \"(Optional) A value passed to the\
        \ Worker runbook, which indicates the basis for its diagnosis.\",\n      \"\
        allowedPattern\" : \"^\\\\[\\\\]$|^\\\\[\\\\\\\"vpc-[0-9a-f]{1,128}\\\\\\\"\
        (, \\\\\\\"vpc-[0-9a-f]{1,128}\\\\\\\")*\\\\]$\",\n      \"default\" : \"\
        []\"\n    },\n    \"MaxConcurrency\" : {\n      \"type\" : \"String\",\n \
        \     \"description\" : \"(Optional) The maximum concurrency for child rate\
        \ control executions.\",\n      \"allowedPattern\" : \"^([1-9]|10)$\",\n \
        \     \"default\" : \"5\"\n    }\n  },\n  \"variables\" : {\n    \"AggregatedOutput\"\
        \ : {\n      \"type\" : \"StringMap\",\n      \"description\" : \"Used to\
