        \    \"DesiredValues\" : [ \"Successful\" ]\n    }\n  }, {\n    \"name\" :\
        \ \"VerifyLambdaVPCConfiguration\",\n    \"action\" : \"aws:executeScript\"\
        ,\n    \"description\" : \"## VerifyLambdaVPCConfiguration\\nVerifies the\
