        \ \"Type\" : \"Number\"\n      },\n      \"PKI\" : {\n        \"AllowedValues\"\
        \ : [ \"One-Tier\", \"Two-Tier\", \"No\" ],\n        \"Default\" : \"No\"\
        ,\n        \"Description\" : \"Deploy Two Tier (Offline Root with Subordinate\
        \ Enterprise CA) or One Tier (Enterprise Root CA) PKI Infrastructure\",\n\
        \        \"Type\" : \"String\"\n      },\n      \"PKIEnableAdvancedAudtingandMetrics\"\
        \ : {\n        \"AllowedValues\" : [ \"true\", \"false\" ],\n        \"Default\"\
        \ : \"false\",\n        \"Description\" : \"Enable advanced auditing and metrics\
        \ and upload them to CloudWatch using the Amazon Kinesis Agent for Microsoft\
        \ Windows\",\n        \"Type\" : \"String\"\n      },\n      \"PrivateSubnet1CIDR\"\
        \ : {\n        \"AllowedPattern\" : \"^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\\\
        \\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])(\\\\/(1[6-9]|2[0-8]))$\"\
        ,\n        \"ConstraintDescription\" : \"CIDR block parameter must be in the\
        \ form x.x.x.x/16-28\",\n        \"Default\" : \"10.0.0.0/19\",\n        \"\
        Description\" : \"CIDR block for private subnet 1 located in Availability\
        \ Zone 1\",\n        \"Type\" : \"String\"\n      },\n      \"PrivateSubnet2CIDR\"\
        \ : {\n        \"AllowedPattern\" : \"^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\\\
