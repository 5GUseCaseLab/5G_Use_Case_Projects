        ,\n        \"Type\" : \"AWS::EC2::KeyPair::KeyName\"\n      },\n      \"MgmtDataDriveSizeGiB\"\
        \ : {\n        \"Default\" : \"2\",\n        \"Description\" : \"Size of the\
        \ Managment Server Data Drive in GiB\",\n        \"MinValue\" : \"1\",\n \
        \       \"MaxValue\" : \"16384\",\n        \"Type\" : \"Number\"\n      },\n\
        \      \"MgmtServer\" : {\n        \"AllowedValues\" : [ \"true\", \"false\"\
        \ ],\n        \"Default\" : \"false\",\n        \"Description\" : \"Do you\
        \ want to deploy a Management Server\",\n        \"Type\" : \"String\"\n \
        \     },\n      \"MgmtServerEnableAdvancedAudtingandMetrics\" : {\n      \
        \  \"Description\" : \"Enable advanced auditing and metrics and upload them\
