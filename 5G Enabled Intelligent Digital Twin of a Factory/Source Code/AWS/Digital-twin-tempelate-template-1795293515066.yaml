        \ : \"DescribeInstanceStatus\",\n      \"InstanceIds\" : [ \"{{ EC2InstanceIdentifier\
        \ }}\" ],\n      \"IncludeAllInstances\" : true,\n      \"PropertySelector\"\
        \ : \"$.InstanceStatuses..InstanceState.Name\",\n      \"DesiredValues\" :\
        \ [ \"running\", \"stopped\" ]\n    }\n  }, {\n    \"name\" : \"DescribeEC2Instance\"\
        ,\n    \"description\" : \"Describe the Amazon EC2 instance and output the\
        \ current instance\",\n    \"action\" : \"aws:executeAwsApi\",\n    \"onFailure\"\
        \ : \"Abort\",\n    \"inputs\" : {\n      \"Service\" : \"ec2\",\n      \"\
        Api\" : \"DescribeInstances\",\n      \"InstanceIds\" : [ \"{{ EC2InstanceIdentifier\
        \ }}\" ]\n    },\n    \"outputs\" : [ {\n      \"Selector\" : \"$.Reservations[0].Instances[0].InstanceType\"\
        ,\n      \"Name\" : \"InstanceType\",\n      \"Type\" : \"String\"\n    }\
        \ ]\n  }, {\n    \"name\" : \"CalculateTargetType\",\n    \"description\"\
        \ : \"Calculates the target instance type\",\n    \"action\" : \"aws:executeScript\"\
        ,\n    \"outputs\" : [ {\n      \"Name\" : \"OriginalInstanceType\",\n   \
        \   \"Selector\" : \"$.Payload.OriginalInstanceType\",\n      \"Type\" : \"\
        String\"\n    }, {\n      \"Name\" : \"TargetInstanceType\",\n      \"Selector\"\
        \ : \"$.Payload.TargetInstanceType\",\n      \"Type\" : \"String\"\n    }\
        \ ],\n    \"inputs\" : {\n      \"Runtime\" : \"python3.11\",\n      \"Handler\"\
        \ : \"get_bigger_instance\",\n      \"Script\" : \"import boto3\\nfrom botocore.config\
        \ import Config\\n\\n\\n\\ndef get_bigger_instance(events, context):\\n  \
        \  config = Config(retries={'max_attempts': 20, 'mode': 'standard'})\\n  \
        \  ec2 = boto3.client('ec2', config=config)\\n    requested_instance_type\
        \ = events[\\\"RequestInstanceType\\\"] or \\\"\\\"\\n    if requested_instance_type:\\\
        n        instance_types_response = ec2.describe_instance_type_offerings(\\\
        n            Filters=[{'Name': 'instance-type', \\\"Values\\\": [requested_instance_type]}])\\\
        n        if instance_types_response:\\n            return {**{'TargetInstanceType':\
        \ requested_instance_type}}\\n        else:\\n            raise Exception(\\\
        \"Requested instance type is not valid: \\\" + requested_instance_type)\\\
        n\\n    current_instance_type = events[\\\"CurrentInstanceType\\\"]\\n   \
        \ instance_type_size = current_instance_type.rsplit(\\\".\\\", 1)\\n    instance_sizes\
        \ = [\\\"nano\\\", \\\"micro\\\", \\\"small\\\", \\\"medium\\\", \\\"large\\\
        \", \\\"xlarge\\\", \\\"2xlarge\\\", \\\"3xlarge\\\", \\\"4xlarge\\\",\\n\
        \                      \\\"6xlarge\\\", \\\"8xlarge\\\", \\\"9xlarge\\\",\
        \ \\\"10xlarge\\\", \\\"12xlarge\\\", \\\"16xlarge\\\", \\\"18xlarge\\\",\
        \ \\\"24xlarge\\\",\\n                      \\\"32xlarge\\\", \\\"56xlarge\\\
        \", \\\"112xlarge\\\"]\\n    bigger_size_start_idx = instance_sizes.index(instance_type_size[1])\
        \ + 1\\n    possible_instance_types = []\\n    for i in range(len(instance_sizes)\
        \ - bigger_size_start_idx):\\n        possible_instance_types.append(instance_type_size[0]\
        \ + \\\".\\\" + instance_sizes[bigger_size_start_idx + i])\\n    instance_types_response\
        \ = ec2.describe_instance_type_offerings(\\n        MaxResults=1000,\\n  \
        \      Filters=[{'Name': 'instance-type', \\\"Values\\\": [instance_type_size[0]\
        \ + \\\".*\\\"]}])\\n    all_instance_types = [offering['InstanceType'] for\
        \ offering in instance_types_response['InstanceTypeOfferings']]\\n    bigger_instances\
        \ = [candidate for candidate in possible_instance_types if candidate in all_instance_types]\\\
        n    if bigger_instances:\\n        return {**{'OriginalInstanceType': current_instance_type},\
        \ **{'TargetInstanceType': bigger_instances[0]}}\\n    else:\\n        raise\
        \ Exception(\\\"Could not identify bigger instance type than current instance\
        \ type: \\\" + current_instance_type)\\n\",\n      \"InputPayload\" : {\n\
        \        \"RequestInstanceType\" : \"{{ EC2InstanceTargetInstanceType }}\"\
        ,\n        \"CurrentInstanceType\" : \"{{ DescribeEC2Instance.InstanceType\
        \ }}\"\n      }\n    }\n  }, {\n    \"name\" : \"StopEC2Instance\",\n    \"\
        description\" : \"Stop the Amazon EC2 instance.\",\n    \"action\" : \"aws:executeAwsApi\"\
        ,\n    \"onFailure\" : \"Abort\",\n    \"inputs\" : {\n      \"Service\" :\
        \ \"ec2\",\n      \"Api\" : \"StopInstances\",\n      \"InstanceIds\" : [\
        \ \"{{ EC2InstanceIdentifier }}\" ]\n    }\n  }, {\n    \"name\" : \"ValidateInstanceIsStopped\"\
        ,\n    \"description\" : \"Validate that the Amazon EC2 instance is stopped.\"\
        ,\n    \"action\" : \"aws:waitForAwsResourceProperty\",\n    \"timeoutSeconds\"\
