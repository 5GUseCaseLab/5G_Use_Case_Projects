        \ else None\\n    )  # using set() to remove duplications in List as it is\
        \ possible to have different event notifications configured with the same\
        \ resource (SQS, SNS or Lambda)\\n    sqs_notifications = event_notifications.get(\\\
        \"QueueConfigurations\\\")\\n    sqs_notifications = (\\n        set([sqs_queue.get(\\\
        \"QueueArn\\\") for sqs_queue in sqs_notifications]) if sqs_notifications\
        \ is not None else None\\n    )\\n    lambda_notifications = event_notifications.get(\\\
        \"LambdaFunctionConfigurations\\\")\\n    lambda_notifications = (\\n    \
        \    set([lambda_function.get(\\\"LambdaFunctionArn\\\") for lambda_function\
