        \ in separate Availability Zones inside a VPC, as well as Remote Desktop Gateway\
        \ instances and managed NAT gateways into the public subnet for each Availability\
        \ Zone. The default Domain Administrator user is 'admin'.  For adding members\
        \ to the domain, ensure that they are launched into the domain member security\
        \ group created by this template and then configure them to use the AD instances\
        \ fixed private IP addresses as the DNS server. **WARNING** This template\
        \ creates Amazon EC2 Windows instance and related resources. You will be billed\
        \ for the AWS resources used if you create a stack from this template. (qs-1rtnidq31)\"\
        ,\n    \"Metadata\" : {\n      \"cfn-lint\" : {\n        \"config\" : {\n\
        \          \"ignore_checks\" : [ \"W9006\", \"W9901\", \"E9902\" ]\n     \
        \   }\n      },\n      \"QuickStartDocumentation\" : {\n        \"EntrypointName\"\
