  SSMDocumentAWSSupportTroubleshootSessionManager:
    UpdateReplacePolicy: "Retain"
    Type: "AWS::SSM::Document"
    DeletionPolicy: "Retain"
    Properties:
      TargetType: "/AWS::EC2::Instance"
      DocumentType: "Automation"
      DocumentFormat: "JSON"
      Content: "{\n  \"description\": \"The **AWSSupport-TroubleshootSessionManager**\
        \ runbook helps troubleshoot common issues when connecting to a managed Amazon\
        \ Elastic Compute Cloud (Amazon EC2) instance using AWS Systems Manager Session\
        \ Manager. This runbook checks the following:\\n\\n> * Checks whether the\
        \ instance is running, passing status checks, and reporting as managed by\
        \ AWS Systems Manager.\\n> * Runs the **AWSSupport-TroubleshootManagedInstance**\
        \ runbook if the instance is not reporting as managed by AWS Systems Manager.\\\
        n> * Checks the version of the SSM Agent installed on the instance.\\n> *\
        \ Checks whether an instance profile containing the recommended AWS Identity\
        \ and Access Management (IAM) policy for Session Manager is attached to the\
        \ Amazon EC2 instance IAM profile.\\n> * Collects diagnostics output from\
        \ [ssm-cli](https://docs.aws.amazon.com/systems-manager/latest/userguide/ssm-cli.html)\
        \ from the instance at the OS level.\\n> * Analyzes the AWS Systems Manager\
        \ Session Manager preferences.\\n> * Runs the **AWSSupport-AnalyzeAWSEndpointReachabilityFromEC2**\
        \ runbook to analyze the instance's connectivity to the required endpoints\
        \ for Session Manager, AWS Key Management Service (AWS KMS), Amazon Simple\
        \ Storage Service (Amazon S3), and Amazon CloudWatch Logs (CloudWatch Logs).\\\
        n\\n### Important:\\n\\n> * Hybrid managed nodes are not supported.\\n> *\
        \ This runbook only checks whether a recommended managed IAM policy is attached\
        \ to the instance profile, it does not analyze IAM or AWS KMS permissions\
        \ contained in the IAM instance profile.\\n> * The **AWSSupport-AnalyzeAWSEndpointReachabilityFromEC2**\
        \ runbook uses [VPC Reachability Analyzer](https://docs.aws.amazon.com/vpc/latest/reachability/what-is-reachability-analyzer.html)\
        \ to analyze the network connectivity between a source and a service endpoint.\
