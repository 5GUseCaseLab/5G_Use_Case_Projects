        \ security group ids.\\n\\n## Output Parameters\\n* UpdateFunctionVPCConfiguration.Response:\
        \ The standard HTTP response from the UpdateFunctionConfiguration API call.\\\
        n\",\n  \"assumeRole\" : \"{{ AutomationAssumeRole }}\",\n  \"parameters\"\
        \ : {\n    \"AutomationAssumeRole\" : {\n      \"type\" : \"AWS::IAM::Role::Arn\"\
        ,\n      \"description\" : \"(Required) The ARN of the role that allows Automation\
        \ to perform the actions on your behalf.\"\n    },\n    \"FunctionName\" :\
        \ {\n      \"type\" : \"String\",\n      \"description\" : \"(Required) The\
