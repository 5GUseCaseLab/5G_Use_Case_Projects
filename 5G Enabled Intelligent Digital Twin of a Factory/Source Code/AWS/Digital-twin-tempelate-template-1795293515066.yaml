        \ {\\n    if [ -f \\\"$WATCHDOG_PID_FILE\\\" ]; then\\n      kill \\\"$(cat\
        \ \\\"$WATCHDOG_PID_FILE\\\")\\\" 2>/dev/null\\n      rm -f \\\"$WATCHDOG_PID_FILE\\\
        \"\\n    fi\\n}\\n\\n# Helper function to handle heartbeat mode logic\\nhandle_heartbeat_update()\
