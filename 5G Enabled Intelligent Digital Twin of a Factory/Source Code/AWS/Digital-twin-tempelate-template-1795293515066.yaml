        ,\n    \"onFailure\" : \"Abort\",\n    \"inputs\" : {\n      \"Service\" :\
        \ \"ec2\",\n      \"Api\" : \"ModifyInstanceAttribute\",\n      \"InstanceId\"\
        \ : \"{{ EC2InstanceIdentifier }}\",\n      \"InstanceType\" : {\n       \
        \ \"Value\" : \"{{ CalculateTargetType.TargetInstanceType }}\"\n      }\n\
        \    },\n    \"outputs\" : [ {\n      \"Selector\" : \"$.InstanceType\",\n\
        \      \"Name\" : \"InstanceType\",\n      \"Type\" : \"String\"\n    } ]\n\
        \  }, {\n    \"name\" : \"StartEC2Instance\",\n    \"description\" : \"Start\
        \ the Amazon EC2 instance.\",\n    \"action\" : \"aws:executeAwsApi\",\n \
        \   \"onFailure\" : \"Abort\",\n    \"inputs\" : {\n      \"Service\" : \"\
        ec2\",\n      \"Api\" : \"StartInstances\",\n      \"InstanceIds\" : [ \"\
        {{ EC2InstanceIdentifier }}\" ]\n    }\n  }, {\n    \"name\" : \"ValidateInstanceIsAvailable\"\
        ,\n    \"description\" : \"Assert that the Amazon EC2 instance is available.\"\
        ,\n    \"action\" : \"aws:waitForAwsResourceProperty\",\n    \"timeoutSeconds\"\
        \ : 900,\n    \"onFailure\" : \"Abort\",\n    \"inputs\" : {\n      \"Service\"\
        \ : \"ec2\",\n      \"Api\" : \"DescribeInstanceStatus\",\n      \"InstanceIds\"\
        \ : [ \"{{ EC2InstanceIdentifier }}\" ],\n      \"PropertySelector\" : \"\
        $.InstanceStatuses..InstanceState.Name\",\n      \"DesiredValues\" : [ \"\
