        \ : \"1\",\n        \"Type\" : \"String\"\n      },\n      \"EntCaServerNetBIOSName\"\
        \ : {\n        \"AllowedPattern\" : \"^[a-zA-Z0-9]+$\",\n        \"Default\"\
