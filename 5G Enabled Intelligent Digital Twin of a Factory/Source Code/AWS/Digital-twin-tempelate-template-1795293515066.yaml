        \ : {\n        \"ParameterGroups\" : [ {\n          \"Label\" : {\n      \
        \      \"default\" : \"Network configuration\"\n          },\n          \"\
        Parameters\" : [ \"AvailabilityZones\", \"NumberOfAZs\", \"VPCCIDR\", \"DHCPOptionSet\"\
        , \"PrivateSubnet1CIDR\", \"PrivateSubnet2CIDR\", \"PrivateSubnet3CIDR\",\
        \ \"PublicSubnet1CIDR\", \"PublicSubnet2CIDR\", \"PublicSubnet3CIDR\" ]\n\
        \        }, {\n          \"Label\" : {\n            \"default\" : \"Amazon\
        \ EC2 configuration\"\n          },\n          \"Parameters\" : [ \"KeyPairName\"\
        \ ]\n        }, {\n          \"Label\" : {\n            \"default\" : \"Microsoft\
        \ Active Directory configuration\"\n          },\n          \"Parameters\"\
        \ : [ \"DomainDNSName\", \"DomainNetBIOSName\", \"DomainAdminPassword\", \"\
        NonWindowsDomainJoin\", \"ADEdition\", \"SetupAppInsightsMonitoring\" ]\n\
        \        }, {\n          \"Label\" : {\n            \"default\" : \"Microsoft\
        \ Windows Server management instance\"\n          },\n          \"Parameters\"\
        \ : [ \"MgmtServer\", \"MgmtServerInstanceType\", \"MgmtDataDriveSizeGiB\"\
        , \"MgmtServerNetBIOSName\", \"MgmtServerEnableAdvancedAudtingandMetrics\"\
        \ ]\n        }, {\n          \"Label\" : {\n            \"default\" : \"Microsoft\
        \ Active Directory Certificate Services configuration\"\n          },\n  \
        \        \"Parameters\" : [ \"PKI\", \"PKIEnableAdvancedAudtingandMetrics\"\
        , \"CaServerInstanceType\", \"CaDataDriveSizeGiB\", \"OrCaServerNetBIOSName\"\
        , \"EntCaServerNetBIOSName\", \"CaKeyLength\", \"CaHashAlgorithm\", \"OrCaValidityPeriodUnits\"\
        , \"CaValidityPeriodUnits\", \"UseS3ForCRL\", \"S3CRLBucketName\" ]\n    \
        \    }, {\n          \"Label\" : {\n            \"default\" : \"Microsoft\
        \ Remote Desktop Gateway Configuration\"\n          },\n          \"Parameters\"\
        \ : [ \"NumberOfRDGWHosts\", \"RDGWInstanceType\", \"RDGWCIDR\" ]\n      \
        \  }, {\n          \"Label\" : {\n            \"default\" : \"AWS Quick Start\
        \ configuration\"\n          },\n          \"Parameters\" : [ \"QSS3BucketName\"\
        , \"QSS3BucketRegion\", \"QSS3KeyPrefix\" ]\n        } ],\n        \"ParameterLabels\"\
        \ : {\n          \"ADEdition\" : {\n            \"default\" : \"AWS Managed\
        \ Microsoft AD Edition\"\n          },\n          \"AvailabilityZones\" :\
        \ {\n            \"default\" : \"Availability Zones\"\n          },\n    \
        \      \"CaDataDriveSizeGiB\" : {\n            \"default\" : \"CA Data Drive\
        \ Size\"\n          },\n          \"CaHashAlgorithm\" : {\n            \"\
        default\" : \"CA Hash Algorithm\"\n          },\n          \"CaKeyLength\"\
        \ : {\n            \"default\" : \"CA Key Length\"\n          },\n       \
        \   \"CaServerInstanceType\" : {\n            \"default\" : \"CA Instance\
        \ Type\"\n          },\n          \"CaValidityPeriodUnits\" : {\n        \
        \    \"default\" : \"Enterprise Root or Subordinate CA Certificate Validity\
        \ Period in Years\"\n          },\n          \"DHCPOptionSet\" : {\n     \
        \       \"default\" : \"Create a DHCP Options set\"\n          },\n      \
        \    \"DomainAdminPassword\" : {\n            \"default\" : \"Admin Account\
        \ Password\"\n          },\n          \"DomainDNSName\" : {\n            \"\
        default\" : \"Domain DNS Name\"\n          },\n          \"DomainNetBIOSName\"\
        \ : {\n            \"default\" : \"Domain NetBIOS Name\"\n          },\n \
        \         \"EntCaServerNetBIOSName\" : {\n            \"default\" : \"Enterprise\
        \ Root or Subordinate CA NetBIOS Name\"\n          },\n          \"KeyPairName\"\
        \ : {\n            \"default\" : \"Key Pair Name\"\n          },\n       \
        \   \"MgmtDataDriveSizeGiB\" : {\n            \"default\" : \"Data Drive Size\"\
        \n          },\n          \"MgmtServer\" : {\n            \"default\" : \"\
        Deploy Management Server\"\n          },\n          \"MgmtServerEnableAdvancedAudtingandMetrics\"\
        \ : {\n            \"default\" : \"Advanced Auditing and Metrics for Management\
        \ Instance\"\n          },\n          \"MgmtServerInstanceType\" : {\n   \
        \         \"default\" : \"Management Server Instance Type\"\n          },\n\
        \          \"MgmtServerNetBIOSName\" : {\n            \"default\" : \"Management\
        \ Server NetBIOS Name\"\n          },\n          \"NonWindowsDomainJoin\"\
        \ : {\n            \"default\" : \"Whether to create an AD user with minimum\
        \ permissions that can be used by non-Windows instances to join the domain\"\
        \n          },\n          \"NumberOfAZs\" : {\n            \"default\" : \"\
        Number of Availability Zones\"\n          },\n          \"NumberOfRDGWHosts\"\
        \ : {\n            \"default\" : \"Number of RDGW Hosts\"\n          },\n\
        \          \"OrCaServerNetBIOSName\" : {\n            \"default\" : \"Offline\
        \ Root CA NetBIOS Name (Only Used For Two Tier PKI)\"\n          },\n    \
        \      \"OrCaValidityPeriodUnits\" : {\n            \"default\" : \"Offline\
