  SSMDocumentAWSResizeInstance:
    UpdateReplacePolicy: "Retain"
    Type: "AWS::SSM::Document"
    DeletionPolicy: "Retain"
    Properties:
      TargetType: "/AWS::EC2::Instance"
      DocumentType: "Automation"
      DocumentFormat: "YAML"
      Content: "{\n  \"description\" : \"Resize an EC2 instance\",\n  \"schemaVersion\"\
        \ : \"0.3\",\n  \"assumeRole\" : \"{{ AutomationAssumeRole }}\",\n  \"parameters\"\
        \ : {\n    \"InstanceId\" : {\n      \"type\" : \"String\",\n      \"description\"\
        \ : \"(Required) The Id of the instance\"\n    },\n    \"InstanceType\" :\
        \ {\n      \"type\" : \"String\",\n      \"description\" : \"(Required) The\
        \ desired instance type\"\n    },\n    \"SleepWait\" : {\n      \"type\" :\
        \ \"String\",\n      \"default\" : \"PT5S\",\n      \"description\" : \"(Optional)\
        \ The desired wait time before starting instance\",\n      \"allowedPattern\"\
        \ : \"^PT([0-9]{1,6}S|[0-9]{1,5}M|[0-9]{1,3}H)$|^PD[0-7]$\"\n    },\n    \"\
        AutomationAssumeRole\" : {\n      \"type\" : \"String\",\n      \"description\"\
        \ : \"(Optional) The ARN of the role that allows Automation to perform the\
        \ actions on your behalf.\",\n      \"default\" : \"\"\n    }\n  },\n  \"\
        mainSteps\" : [ {\n    \"name\" : \"assertInstanceType\",\n    \"action\"\
        \ : \"aws:assertAwsResourceProperty\",\n    \"inputs\" : {\n      \"Service\"\
        \ : \"EC2\",\n      \"Api\" : \"DescribeInstances\",\n      \"InstanceIds\"\
        \ : [ \"{{InstanceId}}\" ],\n      \"PropertySelector\" : \"$.Reservations[0].Instances[0].InstanceType\"\
        ,\n      \"DesiredValues\" : [ \"{{InstanceType}}\" ]\n    },\n    \"onFailure\"\
        \ : \"step:stopInstance\",\n    \"isCritical\" : false,\n    \"isEnd\" : true\n\
        \  }, {\n    \"name\" : \"stopInstance\",\n    \"action\" : \"aws:changeInstanceState\"\
        ,\n    \"inputs\" : {\n      \"InstanceIds\" : [ \"{{InstanceId}}\" ],\n \
        \     \"DesiredState\" : \"stopped\"\n    }\n  }, {\n    \"name\" : \"resizeInstance\"\
        ,\n    \"action\" : \"aws:executeAwsApi\",\n    \"inputs\" : {\n      \"Service\"\
        \ : \"EC2\",\n      \"Api\" : \"ModifyInstanceAttribute\",\n      \"InstanceId\"\
        \ : \"{{InstanceId}}\",\n      \"InstanceType\" : {\n        \"Value\" : \"\
        {{InstanceType}}\"\n      }\n    }\n  }, {\n    \"name\" : \"wait\",\n   \
        \ \"action\" : \"aws:sleep\",\n    \"inputs\" : {\n      \"Duration\" : \"\
        {{SleepWait}}\"\n    }\n  }, {\n    \"name\" : \"startInstance\",\n    \"\
        action\" : \"aws:changeInstanceState\",\n    \"inputs\" : {\n      \"InstanceIds\"\
        \ : [ \"{{InstanceId}}\" ],\n      \"DesiredState\" : \"running\"\n    }\n\
        \  } ]\n}"
      Tags: []
      Name: "AWS-ResizeInstance"
  SSMDocumentAWSConformancePacksSecurityBestPracticesforECS:
    UpdateReplacePolicy: "Retain"
    Type: "AWS::SSM::Document"
    DeletionPolicy: "Retain"
    Properties:
      DocumentType: "ConformancePackTemplate"
      DocumentFormat: "YAML"
      Content: "{\n  \"description\" : \"Security Best Practices for ECS\",\n  \"\
        schemaVersion\" : \"1.0\",\n  \"templateBody\" : {\n    \"Conditions\" : {\n\
        \      \"ecsNoEnvironmentSecretsParamSecretKeys\" : {\n        \"Fn::Not\"\
        \ : [ {\n          \"Fn::Equals\" : [ \"\", {\n            \"Ref\" : \"EcsNoEnvironmentSecretsParamSecretKeys\"\
        \n          } ]\n        } ]\n      },\n      \"ecsTaskDefinitionUserForHostModeCheckParamSkipInactiveTaskDefinitions\"\
        \ : {\n        \"Fn::Not\" : [ {\n          \"Fn::Equals\" : [ \"\", {\n \
        \           \"Ref\" : \"EcsTaskDefinitionUserForHostModeCheckParamSkipInactiveTaskDefinitions\"\
        \n          } ]\n        } ]\n      }\n    },\n    \"Parameters\" : {\n  \
        \    \"EcsNoEnvironmentSecretsParamSecretKeys\" : {\n        \"Default\" :\
        \ \"AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, ECS_ENGINE_AUTH_DATA\",\n  \
        \      \"Type\" : \"String\"\n      },\n      \"EcsTaskDefinitionUserForHostModeCheckParamSkipInactiveTaskDefinitions\"\
        \ : {\n        \"Default\" : \"true\",\n        \"Type\" : \"String\"\n  \
        \    }\n    },\n    \"Resources\" : {\n      \"EcsContainerInsightsEnabled\"\
        \ : {\n        \"Properties\" : {\n          \"ConfigRuleName\" : \"ecs-container-insights-enabled\"\
        ,\n          \"Scope\" : {\n            \"ComplianceResourceTypes\" : [ \"\
        AWS::ECS::Cluster\" ]\n          },\n          \"Source\" : {\n          \
        \  \"Owner\" : \"AWS\",\n            \"SourceIdentifier\" : \"ECS_CONTAINER_INSIGHTS_ENABLED\"\
        \n          }\n        },\n        \"Type\" : \"AWS::Config::ConfigRule\"\n\
        \      },\n      \"EcsContainersNonprivileged\" : {\n        \"Properties\"\
        \ : {\n          \"ConfigRuleName\" : \"ecs-containers-nonprivileged\",\n\
        \          \"Scope\" : {\n            \"ComplianceResourceTypes\" : [ \"AWS::ECS::TaskDefinition\"\
        \ ]\n          },\n          \"Source\" : {\n            \"Owner\" : \"AWS\"\
        ,\n            \"SourceIdentifier\" : \"ECS_CONTAINERS_NONPRIVILEGED\"\n \
        \         }\n        },\n        \"Type\" : \"AWS::Config::ConfigRule\"\n\
        \      },\n      \"EcsContainersReadonlyAccess\" : {\n        \"Properties\"\
        \ : {\n          \"ConfigRuleName\" : \"ecs-containers-readonly-access\",\n\
        \          \"Scope\" : {\n            \"ComplianceResourceTypes\" : [ \"AWS::ECS::TaskDefinition\"\
        \ ]\n          },\n          \"Source\" : {\n            \"Owner\" : \"AWS\"\
        ,\n            \"SourceIdentifier\" : \"ECS_CONTAINERS_READONLY_ACCESS\"\n\
        \          }\n        },\n        \"Type\" : \"AWS::Config::ConfigRule\"\n\
        \      },\n      \"EcsFargateLatestPlatformVersion\" : {\n        \"Properties\"\
        \ : {\n          \"ConfigRuleName\" : \"ecs-fargate-latest-platform-version\"\
        ,\n          \"Scope\" : {\n            \"ComplianceResourceTypes\" : [ \"\
        AWS::ECS::Service\" ]\n          },\n          \"Source\" : {\n          \
        \  \"Owner\" : \"AWS\",\n            \"SourceIdentifier\" : \"ECS_FARGATE_LATEST_PLATFORM_VERSION\"\
        \n          }\n        },\n        \"Type\" : \"AWS::Config::ConfigRule\"\n\
        \      },\n      \"EcsNoEnvironmentSecrets\" : {\n        \"Properties\" :\
        \ {\n          \"ConfigRuleName\" : \"ecs-no-environment-secrets\",\n    \
        \      \"InputParameters\" : {\n            \"secretKeys\" : {\n         \
        \     \"Fn::If\" : [ \"ecsNoEnvironmentSecretsParamSecretKeys\", {\n     \
        \           \"Ref\" : \"EcsNoEnvironmentSecretsParamSecretKeys\"\n       \
        \       }, {\n                \"Ref\" : \"AWS::NoValue\"\n              }\
        \ ]\n            }\n          },\n          \"Scope\" : {\n            \"\
        ComplianceResourceTypes\" : [ \"AWS::ECS::TaskDefinition\" ]\n          },\n\
        \          \"Source\" : {\n            \"Owner\" : \"AWS\",\n            \"\
        SourceIdentifier\" : \"ECS_NO_ENVIRONMENT_SECRETS\"\n          }\n       \
        \ },\n        \"Type\" : \"AWS::Config::ConfigRule\"\n      },\n      \"EcsTaskDefinitionMemoryHardLimit\"\
        \ : {\n        \"Properties\" : {\n          \"ConfigRuleName\" : \"ecs-task-definition-memory-hard-limit\"\
        ,\n          \"Scope\" : {\n            \"ComplianceResourceTypes\" : [ \"\
        AWS::ECS::TaskDefinition\" ]\n          },\n          \"Source\" : {\n   \
        \         \"Owner\" : \"AWS\",\n            \"SourceIdentifier\" : \"ECS_TASK_DEFINITION_MEMORY_HARD_LIMIT\"\
        \n          }\n        },\n        \"Type\" : \"AWS::Config::ConfigRule\"\n\
        \      },\n      \"EcsTaskDefinitionNonrootUser\" : {\n        \"Properties\"\
        \ : {\n          \"ConfigRuleName\" : \"ecs-task-definition-nonroot-user\"\
        ,\n          \"Scope\" : {\n            \"ComplianceResourceTypes\" : [ \"\
        AWS::ECS::TaskDefinition\" ]\n          },\n          \"Source\" : {\n   \
        \         \"Owner\" : \"AWS\",\n            \"SourceIdentifier\" : \"ECS_TASK_DEFINITION_NONROOT_USER\"\
        \n          }\n        },\n        \"Type\" : \"AWS::Config::ConfigRule\"\n\
        \      },\n      \"EcsTaskDefinitionPidModeCheck\" : {\n        \"Properties\"\
        \ : {\n          \"ConfigRuleName\" : \"ecs-task-definition-pid-mode-check\"\
        ,\n          \"Scope\" : {\n            \"ComplianceResourceTypes\" : [ \"\
        AWS::ECS::TaskDefinition\" ]\n          },\n          \"Source\" : {\n   \
        \         \"Owner\" : \"AWS\",\n            \"SourceIdentifier\" : \"ECS_TASK_DEFINITION_PID_MODE_CHECK\"\
        \n          }\n        },\n        \"Type\" : \"AWS::Config::ConfigRule\"\n\
        \      },\n      \"EcsTaskDefinitionUserForHostModeCheck\" : {\n        \"\
        Properties\" : {\n          \"ConfigRuleName\" : \"ecs-task-definition-user-for-host-mode-check\"\
        ,\n          \"InputParameters\" : {\n            \"SkipInactiveTaskDefinitions\"\
        \ : {\n              \"Fn::If\" : [ \"ecsTaskDefinitionUserForHostModeCheckParamSkipInactiveTaskDefinitions\"\
        , {\n                \"Ref\" : \"EcsTaskDefinitionUserForHostModeCheckParamSkipInactiveTaskDefinitions\"\
        \n              }, {\n                \"Ref\" : \"AWS::NoValue\"\n       \
        \       } ]\n            }\n          },\n          \"Scope\" : {\n      \
        \      \"ComplianceResourceTypes\" : [ \"AWS::ECS::TaskDefinition\" ]\n  \
        \        },\n          \"Source\" : {\n            \"Owner\" : \"AWS\",\n\
        \            \"SourceIdentifier\" : \"ECS_TASK_DEFINITION_USER_FOR_HOST_MODE_CHECK\"\
        \n          }\n        },\n        \"Type\" : \"AWS::Config::ConfigRule\"\n\
        \      }\n    }\n  }\n}"
      Tags: []
      Name: "AWSConformancePacks-SecurityBestPracticesforECS"
