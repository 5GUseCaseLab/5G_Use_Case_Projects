    Properties:
      DocumentType: "CloudFormation"
      DocumentFormat: "JSON"
      VersionName: "2.3"
      Content: "{\n  \"schemaVersion\": \"1.0\",\n  \"templateBody\": {\n    \"Parameters\"\
        : {\n      \"QSType\": {\n        \"Type\": \"String\",\n        \"Description\"\
        : \"(Required) Specifies whether the Quick Setup applies to the local account\
        \ or an AWS organization.\",\n        \"AllowedValues\": [\"TA\", \"DA\"]\n\
        \      },\n      \"QSConfigurationId\": {\n        \"Type\": \"String\",\n\
        \        \"Description\": \"(Required) Unique identifier of the deployed configuration.\"\
        \n      },\n      \"QSPrincipalOrgId\": {\n        \"Type\": \"String\",\n\
        \        \"Default\": \"\",\n        \"Description\": \"(Optional) The ID\
        \ of the principal organization your management account operates in.\"\n \
        \     },\n      \"DelegatedAccountId\": {\n        \"Type\": \"String\",\n\
        \        \"AllowedPattern\": \"^\\\\d{12}$\",\n        \"Description\": \"\
        (Required) The ID of the member account in your organization you want to register\
        \ as a delegated administrator.\"\n      },\n      \"JobFunction\": {\n  \
        \      \"Type\": \"String\",\n        \"AllowedPattern\": \"^\\\\w{1,10}$\"\
        ,\n        \"Description\": \"(Required) SSM Change Manager job function name\"\
        \n      },\n      \"PermissionType\": {\n        \"Type\": \"String\",\n \
        \       \"Default\": \"CustomPermissions\",\n        \"AllowedValues\": [\"\
        CustomPermissions\", \"AdminPermissions\"]\n      },\n      \"CustomPermissions\"\
        : {\n        \"Type\": \"String\",\n        \"Default\": \"\",\n        \"\
        Description\": \"(Required if CustomPermissions passed as PermissionType)\
        \ SSM Change Manager job function permissions\"\n      }\n    },\n    \"Conditions\"\
        : {\n      \"IsManagedAccount\": {\n        \"Fn::Not\": [\n          {\n\
        \            \"Fn::Equals\": [\n              { \"Ref\": \"DelegatedAccountId\"\
        \ },\n              { \"Ref\": \"AWS::AccountId\" }\n            ]\n     \
        \     }\n        ]\n      },\n      \"CustomPermissionsSelected\": {\n   \
        \     \"Fn::Equals\": [\n          { \"Ref\": \"PermissionType\" },\n    \
        \      \"CustomPermissions\"\n        ]\n      }\n    },\n    \"Resources\"\
        : {\n      \"RoleForAutomation\": {\n        \"Type\": \"AWS::IAM::Role\"\
        ,\n        \"Properties\": {\n          \"RoleName\": {\n            \"Fn::Join\"\
        : [\n              \"\",\n              [\n                \"AWS-QuickSetup-EnableExplorer-TA-\"\
        ,\n                { \"Ref\": \"QSConfigurationId\" },\n                \"\
        _\",\n                { \"Ref\": \"AWS::Region\" }\n              ]\n    \
        \        ]\n          },\n          \"AssumeRolePolicyDocument\": {\n    \
        \        \"Version\": \"2012-10-17\",\n            \"Statement\": [\n    \
        \          {\n                \"Effect\": \"Allow\",\n                \"Principal\"\
        : { \"Service\": [\"ssm.amazonaws.com\"] },\n                \"Action\": [\"\
        sts:AssumeRole\"],\n                \"Condition\": {\n                  \"\
        StringEquals\": {\n                    \"aws:SourceAccount\": {\n        \
        \              \"Fn::Sub\": \"${AWS::AccountId}\"\n                    }\n\
        \                  },\n                  \"ArnLike\": {\n                \
        \    \"aws:SourceArn\": {\n                      \"Fn::Sub\": \"arn:${AWS::Partition}:ssm:*:${AWS::AccountId}:automation-execution/*\"\
        \n                    }\n                  }\n                }\n        \
        \      }\n            ]\n          },\n          \"ManagedPolicyArns\": [\n\
        \            {\"Fn::Sub\": \"arn:${AWS::Partition}:iam::aws:policy/AWSSystemsManagerEnableExplorerExecutionPolicy\"\
        }\n          ]\n        }\n      },\n      \"SystemAssociationForEnablingExplorer\"\
        : {\n        \"Type\": \"AWS::SSM::Association\",\n        \"Properties\"\
        : {\n          \"Name\": \"AWS-EnableExplorer\",\n          \"AssociationName\"\
        : {\n            \"Fn::Join\": [\n              \"\",\n              [\n \
        \               \"AWS-QuickSetup-SSMChangeMgr-TA-EnableExplorer-\",\n    \
        \            {\n                  \"Ref\": \"QSConfigurationId\"\n       \
        \         }\n              ]\n            ]\n          },\n          \"Parameters\"\
        : {\n            \"AutomationAssumeRole\": [\n              {\n          \
        \      \"Fn::GetAtt\": [\"RoleForAutomation\", \"Arn\"]\n              }\n\
        \            ],\n            \"OpsDataSources\": [\"Association\"]\n     \
        \     }\n        }\n      },\n      \"SSMChangeMgrExecutionRole\": {\n   \
        \     \"Type\": \"AWS::IAM::Role\",\n        \"Properties\": {\n         \
        \ \"AssumeRolePolicyDocument\": {\n            \"Version\": \"2012-10-17\"\
        ,\n            \"Statement\": [\n              {\n                \"Effect\"\
        : \"Allow\",\n                \"Principal\": {\n                  \"AWS\"\
        : {\n                    \"Fn::Join\": [\n                      \"\",\n  \
        \                    [\n                        \"arn:\",\n              \
        \          { \"Ref\": \"AWS::Partition\" },\n                        \":iam::\"\
        ,\n                        { \"Ref\": \"DelegatedAccountId\" },\n        \
        \                \":role/AWS-QuickSetup-SSMChangeMgr-\",\n               \
        \         { \"Ref\": \"JobFunction\" },\n                        \"AdminRole\"\
        \n                      ]\n                    ]\n                  }\n  \
        \              },\n                \"Action\": \"sts:AssumeRole\",\n     \
        \           \"Condition\": {\n                  \"StringEquals\": {\n    \
        \                \"aws:PrincipalOrgID\": [{ \"Ref\": \"QSPrincipalOrgId\"\
        \ }]\n                  }\n                }\n              },\n         \
        \     {\n                \"Effect\": \"Allow\",\n                \"Principal\"\
        : { \"Service\": \"ssm.amazonaws.com\" },\n                \"Action\": \"\
        sts:AssumeRole\"\n              }\n            ]\n          },\n         \
        \ \"Policies\": [\n            {\n              \"PolicyDocument\": {\n  \
        \              \"Fn::If\": [\n                  \"CustomPermissionsSelected\"\
        ,\n                  { \"Ref\": \"CustomPermissions\" },\n               \
        \   \"{\\\"Version\\\":\\\"2012-10-17\\\",\\\"Statement\\\":[{\\\"Effect\\\
        \":\\\"Allow\\\",\\\"Action\\\":\\\"*\\\",\\\"Resource\\\":\\\"*\\\"}]}\"\n\
        \                ]\n              },\n              \"PolicyName\": {\n  \
        \              \"Fn::Join\": [\n                  \"\",\n                \
        \  [{ \"Ref\": \"JobFunction\" }, \"ExecutionRolePolicy\"]\n             \
        \   ]\n              }\n            }\n          ],\n          \"RoleName\"\
        : {\n            \"Fn::Join\": [\n              \"\",\n              [\n \
        \               \"AWS-QuickSetup-SSMChangeMgr-\",\n                { \"Ref\"\
        : \"JobFunction\" },\n                \"InvocationRole\"\n              ]\n\
        \            ]\n          }\n        },\n        \"Condition\": \"IsManagedAccount\"\
        \n      }\n    }\n  }\n}\n"
      Tags: []
      Name: "AWSQuickSetupType-SSMChangeMgr-CFN-TA"
