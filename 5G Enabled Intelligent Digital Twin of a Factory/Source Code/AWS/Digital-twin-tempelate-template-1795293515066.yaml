        n\\n## What does this document do?\\nThis runbook is used for diagnosing connectivity\
        \ issues that prevent SSM Agent from reaching the Systems Manager\\nservice.\
        \ The runbook scans the EC2 instances in your account and identifies those\
        \ which are unmanaged. Then, the\\nrunbook performs a diagnostic analysis\
        \ to determine potential causes for the instances being unmanaged.\\n\\n##\
        \ Input Parameters\\n\\nThe runbook has two modes, `Orchestrator`, and `Worker`.\\\
        n\\n### Orchestrator Mode\\nOrchestrator Mode is responsible for determining\
        \ which nodes are not managed by Systems Manager. This mode segments\\nunmanaged\
        \ nodes according to VPC and starts a child execution to diagnose potential\
        \ problems at a VPC level.\\n\\nIt requires the following parameters:\\n-\
        \ **Mode**: Set to `Orchestrator`\\n- **DiagnosisExecutionId**: A unique ID\
        \ that separates the results from different runbook executions.\\n- **AutomationAssumeRole**:\
        \ The role the runbook assumes to perform a diagnosis.\\n- **BucketName**:\
        \ The S3 bucket that the runbook uses to store its output.\\n\\n### Worker\
        \ Mode\\nWorker Mode is responsible for performing the diagnosis of issues.\
        \ It requires the following parameters:\\n- **Mode**: Set to `Worker`.\\n-\
        \ **DiagnosisExecutionId**: A unique ID that separates the results from different\
        \ runbook executions.\\n- **AutomationAssumeRole**: The role that the runbook\
        \ assumes to perform a diagnosis.\\n- **BucketName**: The S3 bucket that the\
        \ runbook uses to store its output.\\n- **TargetValue**: The specified value\
        \ used to make a diagnosis. For this runbook, the target values are VPC IDs.\\\
        n\\n## Output Parameters\\n* PublishAggregateResult.aggregate_output: The\
        \ aggregated diagnosis output.\\n* PublishAggregateResult.had_failure: An\
        \ indication of whether or not the execution experienced a failure.\",\n \
        \ \"assumeRole\" : \"{{ AutomationAssumeRole }}\",\n  \"parameters\" : {\n\
        \    \"AutomationAssumeRole\" : {\n      \"type\" : \"AWS::IAM::Role::Arn\"\
        ,\n      \"description\" : \"(Required) The role assumed by the runbook to\
        \ perform batching and diagnosis.\"\n    },\n    \"BucketName\" : {\n    \
        \  \"type\" : \"AWS::S3::Bucket::Name\",\n      \"description\" : \"(Required)\
        \ The name of the S3 bucket used to store output.\"\n    },\n    \"BucketOwner\"\
        \ : {\n      \"type\" : \"String\",\n      \"description\" : \"(Required)\
        \ The owner of the S3 bucket used to store output.\",\n      \"allowedPattern\"\
        \ : \"^\\\\d{12}$\"\n    },\n    \"DiagnosisExecutionId\" : {\n      \"type\"\
        \ : \"String\",\n      \"description\" : \"(Required) A unique identifier\
        \ used to separate the S3 output of different runbook executions.\",\n   \
