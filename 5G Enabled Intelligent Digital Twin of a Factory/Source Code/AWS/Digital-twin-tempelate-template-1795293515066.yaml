        \" >&2\\n      cat \\\"${mutated_hosts_file}\\\" >&2\\n      echo \\\"After\
        \ sed operation:\\\" >&2\\n      cat \\\"${restored_hosts_file}\\\" >&2\\\
        n      rm -f \\\"$restored_hosts_file\\\" \\\"$mutated_hosts_file\\\"\\n \
        \     exit 1\\n    fi\\n\\n    if ! cat \\\"$restored_hosts_file\\\" > \\\"\
