        \ {\n      \"Name\" : \"S3EncryptionType\",\n      \"Type\" : \"String\",\n\
        \      \"Selector\" : \"$.Payload.S3EncryptionType\"\n    }, {\n      \"Name\"\
        \ : \"S3EncryptionKey\",\n      \"Type\" : \"String\",\n      \"Selector\"\
        \ : \"$.Payload.S3EncryptionKey\"\n    } ]\n  }, {\n    \"name\" : \"UpdateS3EncryptionType\"\
        ,\n    \"description\" : \"## UpdateS3EncryptionType\\nUpdates the S3 Bucket\
        \ encryption type.\",\n    \"action\" : \"aws:updateVariable\",\n    \"nextStep\"\
        \ : \"UpdateS3EncryptionKey\",\n    \"isEnd\" : false,\n    \"inputs\" : {\n\
        \      \"Name\" : \"variable:S3EncryptionType\",\n      \"Value\" : \"{{ GetS3EncryptionConfiguration.S3EncryptionType\
        \ }}\"\n    }\n  }, {\n    \"name\" : \"UpdateS3EncryptionKey\",\n    \"description\"\
