        \    },\n    {\n      \"name\": \"startInstances\",\n      \"action\": \"\
        aws:changeInstanceState\",\n      \"inputs\": {\n        \"InstanceIds\":\
        \ \"{{ InstanceId }}\",\n        \"DesiredState\": \"running\"\n      }\n\
