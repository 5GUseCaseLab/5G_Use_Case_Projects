        :[{\"action\":\"aws:runPowerShellScript\",\"name\":\"checkWindowsPerformanceCounterSets\"\
        ,\"precondition\":{\"StringEquals\":[\"platformType\",\"Windows\"]},\"inputs\"\
        :{\"timeoutSeconds\":3600,\"runCommand\":[\"$counterSetsInput = \\\"{{ CounterSets\
        \ }}\\\".Trim()\",\"$delim = (',')\",\"$counterSets = ($counterSetsInput -split\
        \ {$delim -contains $_}) | ForEach-Object { $_.Trim() } | Where-Object { $_\
        \ -ne '' }\",\"foreach($counterSet in $counterSets) {\",\"     Try {\",\"\
        \          Get-Counter -ListSet $counterSet -ErrorAction Stop | Out-Null\"\
        ,\"          $counterStatus = 1\",\"     }\",\"     Catch {\",\"         \
        \ $counterStatus = 0\",\"     }\",\"    Write-Host $counterSet','$counterStatus\"\
        ,\"}\"]}}]}"
      Tags: []
      Name: "AWSEC2-CheckPerformanceCounterSets"
