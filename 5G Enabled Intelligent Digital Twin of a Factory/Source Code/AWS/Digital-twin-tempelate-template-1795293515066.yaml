    Type: "AWS::SSM::Document"
    DeletionPolicy: "Retain"
    Properties:
      DocumentType: "Automation"
      DocumentFormat: "YAML"
      Content: "{\n  \"description\" : \"## Id\\nAWSResilienceHub-RestoreAuroraDBClusterFromBackupSOP_2022-10-25\\\
        n\\n## Intent\\nUsed to recover Amazon Aurora database to a known good state.\\\
        n\\n## Type\\nSOP\\n\\n## Risk\\nMedium\\n\\n## Requirements\\n  * Available\
        \ Amazon Aurora DB cluster with a backup snapshot.\\n\\n## Permissions required\
        \ for AutomationAssumeRole\\n  * rds:CreateDBInstance\\n  * rds:DescribeDBClusters\\\
        n  * rds:DescribeDBInstances\\n  * rds:DescribeDBClusterSnapshots\\n  * rds:ModifyDBCluster\\\
        n  * rds:ModifyDBInstance\\n  * rds:RestoreDBClusterFromSnapshot\\n  * rds:AddTagsToResource\
        \ \\n\\n##### In case cluster is encrypted with a KMS key\\n  * kms:CreateGrant\\\
        n  * kms:DescribeKey\\n\\n## Cancellation behavior\\nFail\\n\\n## Inputs\\\
        n### (Required) AutomationAssumeRole\\n  * type: String\\n  * description:\
        \ Amazon Resource Name (ARN) of the IAM role with permissions listed above.\\\
        n\\n### (Required) DBClusterIdentifier\\n  * type: String\\n  * description:\
        \ Amazon Aurora database cluster identifier.\\n\\n### (Required) DBSnapshotIdentifier\\\
        n  * type: String\\n  * description: Aurora DB Snapshot Identifier.\\n\\n##\
        \ Details\\nThe document restores Amazon Aurora database cluster and instances\
        \ from the latest snapshot or the specified \\nsnapshot. The identifiers of\
        \ source cluster and source instances are suffixed with\\\"-replaced\\\",\
        \ while the restored clusters \\nand instances are renamed to the original\
        \ source identifiers. After the clusters and instances are restored, the document\
        \ \\nthen waits for them to become available. If users face any issues while\
        \ restoring, users may need to remove the restored \\ncluster and instances,\
        \ and then remove the \\\"-replaced\\\" suffix from the original source identifiers.\
        \ If renaming fails, \\ncluster with the suffix \\\"-restored-from-backup\\\
        \" and instances with the suffix \\\"-restored\\\" may remain and they should\
        \ be \\nrenamed manually or removed.\\n\\n## Steps executed in normal flow\\\
        n  * TrafficRedirectionPause\\n  * RecordStartTime\\n  * BackupDbClusterMetadata\\\
        n  * BackupDbClusterInstancesMetadata\\n  * GetLatestSnapshotIdentifier\\\
        n  * RestoreAuroraDbCluster\\n  * WaitUntilClusterStateAvailable\\n  * RestoreAuroraDbClusterInstances\\\
        n  * RenameReplacedAuroraDbCluster\\n  * WaitUntilInstanceStateAvailable\\\
        n  * RenameRestoredAuroraDbInstances\\n  * RenameRestoredCluster\\n  * WaitUntilRestoredInstancesAvailable\\\
        n  * OutputRecoveryTime\\n\\n## Outputs\\n### OutputRecoveryTime.RecoveryTime\\\
        n  * type: Integer\\n  * description: SOP execution time in seconds.\\n\\\
        n### BackupDbClusterMetadata.BackupDbClusterInstancesCountValue\\n* type:\
        \ MapList\\n* description: List of instances before recovery.\\n\\n### BackupDbClusterMetadata.AvailabilityZones\\\
        n* type: StringList\\n* description: List of cluster's availability zones.\\\
        n\\n### BackupDbClusterInstancesMetadata.DBClusterInstancesMetadata\\n* type:\
        \ StringMap\\n* description: List of instances metadata before recovery.\\\
        n\\n### GetLatestSnapshotIdentifier.LatestSnapshot\\n* type: String\\n* description:\
        \ Snapshot ID of latest available snapshot.\\n\\n### GetLatestSnapshotIdentifier.LatestSnapshotEngine\\\
        n* type: String\\n* description: Snapshot ID of the latest available snapshot\
        \ engine.\\n\\n### GetLatestSnapshotIdentifier.LatestClusterIdentifier\\n*\
        \ type: String\\n* description: Cluster ID of latest available snapshot cluster.\\\
        n\\n### RestoreAuroraDbCluster.RestoredClusterIdentifier\\n* type: String\\\
        n* description: Cluster ID of the restored Amazon Aurora database cluster\
        \ after recovery.\\n\\n### RestoreAuroraDbClusterInstances.RestoredInstancesIdentifiers\\\
        n* type: StringList\\n* description: List of restored Amazon Aurora database\
        \ cluster?s instance IDs after recovery.\\n\\n### RenameReplacedAuroraDbCluster.ReplacedClusterIdentifier\\\
        n* type: String\\n* description: Cluster ID of restored Amazon Aurora database\
        \ cluster after recovery and renaming identifier.\\n\\n### RenameReplacedAuroraDbInstances.ReplacedInstancesIdentifiers\\\
        n* type: String\\n* description: List of replaced Amazon Aurora database instance\
        \ IDs after recovery and renaming identifier.\\n\\n### RenameRestoredAuroraDbInstances.RestoredInstancesIdentifiers\\\
        n* type: String\\n* description: List of restored Amazon Aurora database instance\
        \ IDs after recovery and renaming identifier.\",\n  \"schemaVersion\" : \"\
        0.3\",\n  \"assumeRole\" : \"{{ AutomationAssumeRole }}\",\n  \"outputs\"\
        \ : [ \"BackupDbClusterMetadata.BackupDbClusterInstancesCountValue\", \"BackupDbClusterMetadata.AvailabilityZones\"\
        , \"BackupDbClusterInstancesMetadata.DBClusterInstancesMetadata\", \"GetLatestSnapshotIdentifier.LatestSnapshot\"\
        , \"GetLatestSnapshotIdentifier.LatestSnapshotEngine\", \"GetLatestSnapshotIdentifier.LatestClusterIdentifier\"\
        , \"RestoreAuroraDbCluster.RestoredClusterIdentifier\", \"RestoreAuroraDbClusterInstances.RestoredInstancesIdentifiers\"\
        , \"RenameReplacedAuroraDbCluster.ReplacedClusterIdentifier\", \"RenameReplacedAuroraDbInstances.ReplacedInstancesIdentifiers\"\
        , \"RenameRestoredAuroraDbInstances.RestoredInstancesIdentifiers\", \"OutputRecoveryTime.RecoveryTime\"\
        \ ],\n  \"parameters\" : {\n    \"DBClusterIdentifier\" : {\n      \"type\"\
        \ : \"String\",\n      \"allowedPattern\" : \"^[0-9a-zA-Z.\\\\-_/:]+$\",\n\
        \      \"description\" : \"(Required) Database Cluster Identifier\"\n    },\n\
        \    \"DBSnapshotIdentifier\" : {\n      \"type\" : \"String\",\n      \"\
        allowedPattern\" : \"^[0-9a-zA-Z.\\\\-_/:]+$\",\n      \"default\" : \"latest\"\
        ,\n      \"description\" : \"(Optional) Database Snapshot Identifier\"\n \
        \   },\n    \"AutomationAssumeRole\" : {\n      \"type\" : \"String\",\n \
        \     \"allowedPattern\" : \"^[0-9a-zA-Z.\\\\-_/:]+$\",\n      \"description\"\
        \ : \"(Required) The ARN of the role that allows Automation to perform the\
        \ actions on your behalf. If no role is specified, Systems Manager Automation\
        \ uses your IAM permissions to run this document.\"\n    }\n  },\n  \"mainSteps\"\
        \ : [ {\n    \"name\" : \"TrafficRedirectionPause\",\n    \"action\" : \"\
        aws:pause\",\n    \"inputs\" : {\n      \"Message\" : \"Resume execution once\
        \ traffic has been redirected from the resource\"\n    }\n  }, {\n    \"name\"\
        \ : \"RecordStartTime\",\n    \"description\" : \"Start recording execution\
        \ time\",\n    \"action\" : \"aws:executeScript\",\n    \"outputs\" : [ {\n\
        \      \"Name\" : \"StartTime\",\n      \"Selector\" : \"$.Payload\",\n  \
        \    \"Type\" : \"String\"\n    } ],\n    \"inputs\" : {\n      \"Runtime\"\
        \ : \"python3.11\",\n      \"Handler\" : \"start_time\",\n      \"Script\"\
        \ : \"import logging\\nimport time\\nfrom datetime import datetime, timezone\\\
        n\\nimport boto3\\nfrom botocore.exceptions import ClientError\\nfrom dateutil\
        \ import parser\\n\\nlogger = logging.getLogger()\\nlogger.setLevel(logging.INFO)\\\
        n\\n\\n\\ndef start_time(events, context):\\n    return datetime.now(timezone.utc).isoformat()\"\
        \n    }\n  }, {\n    \"name\" : \"BackupDbClusterMetadata\",\n    \"action\"\
        \ : \"aws:executeAwsApi\",\n    \"description\" : \"Backup current DbClusterInstances\
        \ value\",\n    \"inputs\" : {\n      \"Service\" : \"rds\",\n      \"Api\"\
        \ : \"DescribeDBClusters\",\n      \"Filters\" : [ {\n        \"Name\" : \"\
        db-cluster-id\",\n        \"Values\" : [ \"{{ DBClusterIdentifier }}\" ]\n\
        \      } ]\n    },\n    \"outputs\" : [ {\n      \"Name\" : \"BackupDbClusterInstancesCountValue\"\
        ,\n      \"Selector\" : \"$.DBClusters[0].DBClusterMembers\",\n      \"Type\"\
        \ : \"MapList\"\n    }, {\n      \"Name\" : \"AvailabilityZones\",\n     \
        \ \"Selector\" : \"$.DBClusters[0].AvailabilityZones\",\n      \"Type\" :\
        \ \"StringList\"\n    } ]\n  }, {\n    \"name\" : \"BackupDbClusterInstancesMetadata\"\
        ,\n    \"action\" : \"aws:executeScript\",\n    \"description\" : \"Backup\
        \ current DbClusterInstances type\",\n    \"onFailure\" : \"Abort\",\n   \
        \ \"outputs\" : [ {\n      \"Name\" : \"DBClusterInstancesMetadata\",\n  \
        \    \"Selector\" : \"$.Payload.DBClusterInstancesMetadata\",\n      \"Type\"\
        \ : \"StringMap\"\n    } ],\n    \"inputs\" : {\n      \"Runtime\" : \"python3.11\"\
        ,\n      \"Handler\" : \"backup_cluster_instances_type\",\n      \"InputPayload\"\
        \ : {\n        \"DBClusterIdentifier\" : \"{{ DBClusterIdentifier }}\",\n\
        \        \"DBClusterInstances\" : \"{{ BackupDbClusterMetadata.BackupDbClusterInstancesCountValue\
        \ }}\"\n      },\n      \"Script\" : \"import logging\\nimport random\\nimport\
        \ time\\nfrom datetime import datetime, timezone\\nfrom operator import itemgetter\\\
        n\\nimport boto3\\nimport botocore\\nfrom botocore.config import Config\\\
        nfrom botocore.exceptions import ClientError\\n\\nlogger = logging.getLogger(__name__)\\\
