        ,\n      \"InputPayload\" : {\n        \"FunctionName\" : \"{{ FunctionName\
        \ }}\",\n        \"SecurityGroupIds\" : \"{{ SecurityGroupIds }}\",\n    \
        \    \"SubnetIds\" : \"{{ SubnetIds }}\"\n      },\n      \"Script\" : \"\
        import boto3\\ndef verifySecurityGroups(lambda_config_details, security_group_ids):\\\
        n  for security_group in security_group_ids:\\n    if security_group not in\
        \ lambda_config_details['VpcConfig']['SecurityGroupIds']:\\n      return False\\\
        n  return True\\n\\ndef verifySubnetIds(lambda_config_details, subnet_ids):\\\
        n  for subnet_id in subnet_ids:\\n    if subnet_id not in lambda_config_details['VpcConfig']['SubnetIds']:\\\
        n      return False\\n  return True\\n\\ndef handler(event, context):\\n \
        \ lambda_client = boto3.client(\\\"lambda\\\")\\n  function_name = event[\\\
        \"FunctionName\\\"]\\n  security_group_ids = event[\\\"SecurityGroupIds\\\"\
        ]\\n  subnet_ids = event[\\\"SubnetIds\\\"]\\n  lambda_config_details = lambda_client.get_function_configuration(FunctionName=function_name)\\\
        n  if verifySecurityGroups(lambda_config_details,security_group_ids) and verifySubnetIds(lambda_config_details,subnet_ids):\\\
