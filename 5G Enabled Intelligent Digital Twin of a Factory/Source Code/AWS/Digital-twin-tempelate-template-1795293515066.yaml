  SSMDocumentAWSQuickSetupTypeJITNACFNDA:
    UpdateReplacePolicy: "Retain"
    Type: "AWS::SSM::Document"
    DeletionPolicy: "Retain"
    Properties:
      DocumentType: "CloudFormation"
      DocumentFormat: "JSON"
      VersionName: "1.1"
      Content: "{\n  \"schemaVersion\": \"1.0\",\n  \"templateBody\": {\n    \"Metadata\"\
        : {\n      \"Version\": \"1.0\"\n    },\n    \"Parameters\": {\n      \"QSType\"\
        : {\n        \"Type\": \"String\",\n        \"AllowedValues\": [\n       \
        \   \"DA\"\n        ],\n        \"Default\": \"DA\",\n        \"Description\"\
        : \"(Required) Specifies whether the Quick Setup applies to the local account\
        \ or an AWS organization.\"\n      },\n      \"QSConfigurationId\": {\n  \
        \      \"Type\": \"String\",\n        \"Description\": \"(Required) Unique\
        \ identifier of the deployed configuration.\"\n      },\n      \"DelegatedAccountId\"\
        : {\n        \"Type\": \"String\",\n        \"AllowedPattern\": \"^\\\\d{12}$\"\
        ,\n        \"Description\": \"(Required) The ID of the member account in your\
        \ organization you want to register as a delegated administrator.\"\n    \
        \  },\n      \"HomeRegion\": {\n        \"Type\": \"String\",\n        \"\
        Description\": \"(Required) Name of the AWS Region to deploy global resources\
        \ such as S3 buckets.\"\n      },\n      \"IdentityProviderSetting\": {\n\
        \        \"Type\": \"String\",\n        \"AllowedValues\": [\n          \"\
        IAM\",\n          \"SSO\",\n          \"\"\n        ],\n        \"Default\"\
        : \"\",\n        \"Description\": \"(Optional) Specifies identity provider\
        \ IAM Identity Access Management (IAM) or Single Sign-On (SSO) used for determining\
        \ who is the current access control template approver.\"\n      }\n    },\n\
        \    \"Conditions\": {\n      \"IdentityProviderSettingExists\": {\n     \
        \   \"Fn::Not\": [\n          {\n            \"Fn::Equals\": [\n         \
        \     {\n                \"Ref\": \"IdentityProviderSetting\"\n          \
        \    },\n              \"\"\n            ]\n          }\n        ]\n     \
        \ },\n      \"IsOrgDeployment\": {\n        \"Fn::Not\": [\n          {\n\
        \            \"Fn::Equals\": [\n              {\n                \"Ref\":\
        \ \"QSType\"\n              },\n              \"LA\"\n            ]\n    \
        \      }\n        ]\n      },\n      \"IsDelegatedAccount\": {\n        \"\
        Fn::Equals\": [\n          {\n            \"Ref\": \"DelegatedAccountId\"\n\
        \          },\n          {\n            \"Ref\": \"AWS::AccountId\"\n    \
        \      }\n        ]\n      },\n      \"IsHomeRegion\": {\n        \"Fn::Equals\"\
        : [\n          {\n            \"Ref\": \"HomeRegion\"\n          },\n    \
        \      {\n            \"Ref\": \"AWS::Region\"\n          }\n        ]\n \
        \     },\n      \"ShouldPropagatePolicies\": {\n        \"Fn::And\": [\n \
        \         {\n            \"Condition\": \"IsHomeRegion\"\n          },\n \
        \         {\n            \"Condition\": \"IsDelegatedAccount\"\n         \
        \ }\n        ]\n      }\n    },\n    \"Resources\": {\n      \"RoleForAutomationV2\"\
        : {\n        \"Type\": \"AWS::IAM::Role\",\n        \"Properties\": {\n  \
        \        \"RoleName\": {\n            \"Fn::Sub\": \"AWS-QuickSetup-EnableJITNA-DA-V2-${AWS::Region}\"\
        \n          },\n          \"AssumeRolePolicyDocument\": {\n            \"\
        Version\": \"2012-10-17\",\n            \"Statement\": [\n              {\n\
        \                \"Effect\": \"Allow\",\n                \"Principal\": {\n\
        \                  \"Service\": [\n                    \"ssm.amazonaws.com\"\
        \n                  ]\n                },\n                \"Action\": [\n\
        \                  \"sts:AssumeRole\"\n                ],\n              \
        \  \"Condition\": {\n                  \"StringEquals\": {\n             \
        \       \"aws:SourceAccount\": {\n                      \"Fn::Sub\": \"${AWS::AccountId}\"\
        \n                    }\n                  },\n                  \"ArnLike\"\
        : {\n                    \"aws:SourceArn\": {\n                      \"Fn::Sub\"\
        : \"arn:${AWS::Partition}:ssm:*:${AWS::AccountId}:automation-execution/*\"\
        \n                    }\n                  }\n                }\n        \
        \      }\n            ]\n          },\n          \"ManagedPolicyArns\": [\n\
        \            {\n              \"Fn::Sub\": \"arn:${AWS::Partition}:iam::aws:policy/AWSQuickSetupManageJITNAResourcesExecutionPolicy\"\
        \n            }\n          ]\n        },\n        \"Condition\": \"IsDelegatedAccount\"\
        \n      },\n      \"AssociationForCreatingResouces\": {\n        \"Type\"\
        : \"AWS::SSM::Association\",\n        \"Properties\": {\n          \"AssociationName\"\
        : {\n            \"Fn::Sub\": [\n              \"AWS-QuickSetup-EnableJITNA-DA-${QSConfigurationId}\"\
        ,\n              {\n                \"QSConfigurationId\": {\n           \
        \       \"Ref\": \"QSConfigurationId\"\n                }\n              }\n\
        \            ]\n          },\n          \"Name\": \"AWSQuickSetupType-SetupJITNAResources\"\
        ,\n          \"Parameters\": {\n            \"AutomationAssumeRole\": [\n\
        \              {\n                \"Fn::GetAtt\": [\n                  \"\
        RoleForAutomationV2\",\n                  \"Arn\"\n                ]\n   \
        \           }\n            ],\n            \"IdentityProviderSetting\": {\n\
        \              \"Fn::If\": [\n                \"IdentityProviderSettingExists\"\
        ,\n                [\n                  {\n                    \"Ref\": \"\
        IdentityProviderSetting\"\n                  }\n                ],\n     \
        \           {\n                  \"Ref\": \"AWS::NoValue\"\n             \
        \   }\n              ]\n            }\n          },\n          \"ScheduleExpression\"\
        : {\n            \"Fn::If\": [\n              \"IsOrgDeployment\",\n     \
        \         \"rate(1 day)\",\n              {\n                \"Ref\": \"AWS::NoValue\"\
        \n              }\n            ]\n          }\n        },\n        \"Condition\"\
        : \"IsDelegatedAccount\"\n      },\n      \"RoleForPolicyPropagationAutomation\"\
        : {\n        \"Type\": \"AWS::IAM::Role\",\n        \"Properties\": {\n  \
        \        \"RoleName\":{\n            \"Fn::Sub\": \"SSMJustInTimeNodeAccessPolicyPropagationRole-${QSConfigurationId}\"\
        \n          },\n          \"AssumeRolePolicyDocument\": {\n            \"\
        Version\": \"2012-10-17\",\n            \"Statement\": [\n              {\n\
        \                \"Effect\": \"Allow\",\n                \"Principal\": {\n\
        \                  \"Service\": [\n                    \"ssm.amazonaws.com\"\
        \n                  ]\n                },\n                \"Action\": [\n\
        \                  \"sts:AssumeRole\"\n                ]\n              }\n\
        \            ]\n          },\n          \"Path\": \"/\",\n          \"ManagedPolicyArns\"\
        : [\n            {\n              \"Fn::Sub\": \"arn:${AWS::Partition}:iam::aws:policy/AWSSystemsManagerJustInTimeNodeAccessRolePropagationPolicy\"\
        \n            }\n          ]\n        },\n        \"Condition\": \"ShouldPropagatePolicies\"\
        \n      },\n      \"AssociationForPolicyPropagation\": {\n        \"Type\"\
        : \"AWS::SSM::Association\",\n        \"Properties\": {\n          \"AssociationName\"\
        : {\n            \"Fn::Sub\": \"AWS-QuickSetup-SSMJustInTimeNodeAccessPolicyPropagation-${QSConfigurationId}\"\
        \n          },\n          \"Name\": \"AWSQuickSetupType-PropagateJustInTimeNodeAccessPolicies\"\
        ,\n          \"Parameters\": {\n            \"AutomationAssumeRole\": [\n\
        \              {\n                \"Fn::GetAtt\": [\n                  \"\
        RoleForPolicyPropagationAutomation\",\n                  \"Arn\"\n       \
        \         ]\n              }\n            ]\n          },\n          \"ScheduleExpression\"\
        : {\n            \"Fn::If\": [\n              \"IsOrgDeployment\",\n     \
        \         \"rate(30 minutes)\",\n              {\n                \"Ref\"\
        : \"AWS::NoValue\"\n              }\n            ]\n          }\n        },\n\
        \        \"Condition\": \"ShouldPropagatePolicies\",\n        \"DependsOn\"\
        : \"RoleForPolicyPropagationAutomation\"\n      }\n    }\n  }\n}"
      Tags: []
      Name: "AWSQuickSetupType-JITNA-CFN-DA"
