        \  \"name\" : \"GetS3EncryptionConfiguration\",\n    \"description\" : \"\
        ## GetS3EncryptionConfiguration\\nDetermines the S3 Bucket encryption type.\"\
        ,\n    \"action\" : \"aws:executeScript\",\n    \"nextStep\" : \"UpdateS3EncryptionType\"\
        ,\n    \"isEnd\" : false,\n    \"inputs\" : {\n      \"Runtime\" : \"python3.11\"\
        ,\n      \"Handler\" : \"script_handler\",\n      \"Attachment\" : \"attachments.zip\"\
        ,\n      \"InputPayload\" : {\n        \"BucketName\" : \"{{ BucketName }}\"\
        ,\n        \"BucketOwner\" : \"{{ BucketOwner }}\"\n      },\n      \"Script\"\
        \ : \"from attachments.s3_utils import S3WrapperClient\\n\\ndef script_handler(events,\
        \ context):\\n    bucket_name = events['BucketName']\\n    bucket_owner =\
