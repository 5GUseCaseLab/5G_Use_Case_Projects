        \ numbers and symbols\",\n        \"MaxLength\" : \"32\",\n        \"MinLength\"\
        \ : \"8\",\n        \"NoEcho\" : \"true\",\n        \"Type\" : \"String\"\n\
        \      },\n      \"DomainDNSName\" : {\n        \"AllowedPattern\" : \"^([a-zA-Z0-9]+[\\\
