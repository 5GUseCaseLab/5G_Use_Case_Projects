        \ \"String\",\n        \"Default\" : \"false\"\n      },\n      \"MgmtServerInstanceType\"\
        \ : {\n        \"AllowedValues\" : [ \"t3.medium\", \"t3.large\", \"t3.xlarge\"\
        , \"t3.2xlarge\", \"m5.large\", \"m5.xlarge\", \"m5.2xlarge\", \"m5.4xlarge\"\
        \ ],\n        \"Default\" : \"t3.medium\",\n        \"Description\" : \"Amazon\
        \ EC2 instance type for the Management Server\",\n        \"Type\" : \"String\"\
        \n      },\n      \"MgmtServerNetBIOSName\" : {\n        \"AllowedPattern\"\
        \ : \"^[a-zA-Z0-9]+$\",\n        \"Default\" : \"MGMT1\",\n        \"Description\"\
