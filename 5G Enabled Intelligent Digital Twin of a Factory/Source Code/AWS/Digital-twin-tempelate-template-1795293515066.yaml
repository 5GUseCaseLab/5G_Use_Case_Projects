  SSMDocumentAWSQuickSetupTypeDHMCCFNTA:
    UpdateReplacePolicy: "Retain"
    Type: "AWS::SSM::Document"
    DeletionPolicy: "Retain"
    Properties:
      DocumentType: "CloudFormation"
      DocumentFormat: "JSON"
      VersionName: "2.2"
      Content: "{\n  \"schemaVersion\": \"1.0\",\n  \"templateBody\": {\n    \"AWSTemplateFormatVersion\"\
        : \"2010-09-09\",\n    \"Parameters\": {\n      \"QSType\": {\n        \"\
        Type\": \"String\",\n        \"AllowedValues\": [\"TA\"],\n        \"Default\"\
        : \"TA\",\n        \"Description\": \"(Required) Specifies the type of target\
        \ for the Quick Setup configuration.\"\n      },\n      \"QSConfigurationId\"\
        : {\n        \"Type\": \"String\",\n        \"Default\": \"\",\n        \"\
        Description\": \"(Required) The unique identifier of the deployed configuration.\"\
        \n      },\n      \"UpdateSSMAgent\": {\n        \"Type\": \"String\",\n \
        \       \"Default\": \"true\",\n        \"AllowedValues\": [\"true\", \"false\"\
        ],\n        \"Description\": \"(Required) Specifies whether to enable automatic\
        \ updates of the SSM Agent every two weeks\"\n      }\n    },\n    \"Conditions\"\
        : {\n      \"UpdateSSMAgent\": {\n        \"Fn::Equals\": [\n          {\n\
        \            \"Ref\": \"UpdateSSMAgent\"\n          },\n          \"true\"\
        \n        ]\n      }\n    },\n    \"Resources\": {\n      \"EnableDHMCAutomationAssumeRole\"\
        : {\n        \"Type\": \"AWS::IAM::Role\",\n        \"Properties\": {\n  \
        \        \"RoleName\": {\n            \"Fn::Sub\": \"AWS-QuickSetup-DHMCRole-${QSConfigurationId}-${AWS::Region}\"\
        \n          },\n          \"Description\": \"Do Not Modify or Delete. This\
        \ resource has been created to support the deployment of DHMC Quick Setup\
        \ configuration, and modification or deletion of this resource may hinder\
        \ the functionality of that Quick Setup configuration.\",\n          \"Path\"\
        : \"/\",\n          \"AssumeRolePolicyDocument\": {\n            \"Version\"\
        : \"2012-10-17\",\n            \"Statement\": [\n              {\n       \
        \         \"Effect\": \"Allow\",\n                \"Principal\": {\n     \
        \             \"Service\": \"ssm.amazonaws.com\"\n                },\n   \
        \             \"Action\": \"sts:AssumeRole\",\n                \"Condition\"\
        : {\n                  \"StringEquals\": {\n                    \"aws:SourceAccount\"\
        : {\n                      \"Fn::Sub\": \"${AWS::AccountId}\"\n          \
        \          }\n                  },\n                  \"ArnLike\": {\n   \
        \                 \"aws:SourceArn\": {\n                      \"Fn::Sub\"\
        : \"arn:${AWS::Partition}:ssm:*:${AWS::AccountId}:automation-execution/*\"\
        \n                    }\n                  }\n                }\n        \
        \      }\n            ]\n          },\n          \"ManagedPolicyArns\": [\n\
        \            {\n              \"Fn::Sub\": \"arn:${AWS::Partition}:iam::aws:policy/AWSQuickSetupEnableDHMCExecutionPolicy\"\
        \n            },\n            {\n              \"Fn::Sub\": \"arn:${AWS::Partition}:iam::aws:policy/AWSSystemsManagerEnableExplorerExecutionPolicy\"\
        \n            }\n          ],\n          \"Tags\": [\n            {\n    \
        \          \"Key\": \"QSConfigId\",\n              \"Value\": {\n        \
        \        \"Ref\": \"QSConfigurationId\"\n              }\n            }\n\
        \          ]\n        }\n      },\n      \"EnableDHMCAssociation\": {\n  \
        \      \"Type\": \"AWS::SSM::Association\",\n        \"Properties\": {\n \
        \         \"AssociationName\": {\n            \"Fn::Sub\": \"AWS-QuickSetup-DHMC-EnableDHMC-${QSConfigurationId}\"\
        \n          },\n          \"Name\": \"AWSQuickSetupType-EnableDHMC\",\n  \
        \        \"ScheduleExpression\": \"rate(1 day)\",\n          \"Parameters\"\
        : {\n            \"AutomationAssumeRole\": [\n              {\n          \
        \      \"Fn::GetAtt\": [\"EnableDHMCAutomationAssumeRole\", \"Arn\"]\n   \
        \           }\n            ]\n          }\n        }\n      },\n      \"SSMAgentUpdateAssociation\"\
        : {\n        \"Type\": \"AWS::SSM::Association\",\n        \"Properties\"\
        : {\n          \"AssociationName\": {\n            \"Fn::Sub\": \"AWS-QuickSetup-DHMC-UpdateSSMAgent-${QSConfigurationId}\"\
        \n          },\n          \"Name\": \"AWS-UpdateSSMAgent\",\n          \"\
        ScheduleExpression\": \"rate(14 days)\",\n          \"Targets\": [\n     \
        \       {\n              \"Key\": \"InstanceIds\",\n              \"Values\"\
        : [\"*\"]\n            }\n          ]\n        },\n        \"Condition\":\
        \ \"UpdateSSMAgent\"\n      },\n      \"SystemAssociationForEnablingExplorer\"\
        : {\n        \"Type\": \"AWS::SSM::Association\",\n        \"Properties\"\
        : {\n          \"AssociationName\": {\n            \"Fn::Sub\": \"AWS-QuickSetup-DHMC-EnableExplorer-${QSConfigurationId}\"\
        \n          },\n          \"Name\": \"AWS-EnableExplorer\",\n          \"\
        Parameters\": {\n            \"AutomationAssumeRole\": [\n              {\n\
        \                \"Fn::GetAtt\": [\"EnableDHMCAutomationAssumeRole\", \"Arn\"\
        ]\n              }\n            ],\n            \"OpsDataSources\": [\"Association\"\
        ]\n          }\n        }\n      }\n    }\n  }\n}\n"
      Tags: []
      Name: "AWSQuickSetupType-DHMC-CFN-TA"
