        \ }\n  },\n  \"mainSteps\": [\n    {\n      \"name\": \"approve\",\n     \
        \ \"action\": \"aws:approve\",\n      \"onFailure\": \"Abort\",\n      \"\
        inputs\": {\n        \"NotificationArn\": \"{{ SNSTopicArn }}\",\n       \
        \ \"Message\": \"Approval required to restart EC2 instances\",\n        \"\
        MinRequiredApprovals\": 1,\n        \"Approvers\": \"{{ Approvers }}\"\n \
