  SSMDocumentAWSAttachExcludeConditionToS3DenyPolicies:
    UpdateReplacePolicy: "Retain"
    Type: "AWS::SSM::Document"
    DeletionPolicy: "Retain"
    Properties:
      DocumentType: "Automation"
      DocumentFormat: "YAML"
      Content: "{\n  \"description\" : \"The AWS-AttachExcludeConditionToS3DenyPolicies\
        \ runbook excludes the specified principal from all Deny statements of an\
        \ S3 bucket's resource based policies. The operation is skipped if the specified\
        \ principal is already excluded using an ArnNotLike condition operator.\\\
        n\\nWarning: For resources that are managed by CloudFormation stacks, it is\
        \ recommended to modify the resource only through Cloudformation. Manual modification\
        \ may result in a drift between the resource state and it's definition in\
        \ the stack.\\n\",\n  \"schemaVersion\" : \"0.3\",\n  \"assumeRole\" : \"\
        {{ AutomationAssumeRole }}\",\n  \"parameters\" : {\n    \"BucketName\" :\
        \ {\n      \"type\" : \"String\",\n      \"description\" : \"The name of the\
        \ S3 bucket whose resource based policies you want to update.\",\n      \"\
        allowedPattern\" : \"^[A-Za-z\\\\d][\\\\w.-]{1,253}[A-Za-z\\\\d]$\"\n    },\n\
        \    \"PrincipalToRemoveFromDenyPolicy\" : {\n      \"type\" : \"String\"\
        ,\n      \"description\" : \"The principal ARN to exclude from the Deny statement.\
        \ The principal must be an ARN of one of the following: IAM role, IAM user,\
        \ AWS STS federated user session, or AWS account root user.\",\n      \"allowedPattern\"\
        \ : \"^([a-zA-Z0-9:/._-]{3,1024})$\"\n    },\n    \"AutomationAssumeRole\"\
        \ : {\n      \"type\" : \"String\",\n      \"description\" : \"The ARN of\
        \ the role that allows Automation to perform the actions on your behalf.\"\
        ,\n      \"allowedPattern\" : \"^arn:aws[a-z0-9-]*:iam::\\\\d{12}:role\\\\\
        /[\\\\w-\\\\/.@+=,]{1,1017}$\"\n    }\n  },\n  \"mainSteps\" : [ {\n    \"\
        description\" : \"Gets the S3 bucket's existing resource-based policy.\",\n\
        \    \"name\" : \"getBucketPolicy\",\n    \"action\" : \"aws:executeAwsApi\"\
        ,\n    \"nextStep\" : \"modifyPolicy\",\n    \"isEnd\" : false,\n    \"inputs\"\
        \ : {\n      \"Service\" : \"s3\",\n      \"Api\" : \"GetBucketPolicy\",\n\
        \      \"Bucket\" : \"{{ BucketName }}\"\n    },\n    \"outputs\" : [ {\n\
        \      \"Name\" : \"PolicyDocument\",\n      \"Selector\" : \"$.Policy\",\n\
        \      \"Type\" : \"String\"\n    } ]\n  }, {\n    \"description\" : \"Adds\
        \ or updates exclude conditions for any deny statements in the bucket policy\
        \ that contains the specified principal.\",\n    \"name\" : \"modifyPolicy\"\
        ,\n    \"action\" : \"aws:executeScript\",\n    \"nextStep\" : \"updateBucketPolicy\"\
        ,\n    \"isEnd\" : false,\n    \"inputs\" : {\n      \"Runtime\" : \"python3.11\"\
        ,\n      \"Handler\" : \"modify_policy\",\n      \"Script\" : \"import json\\\
        n\\ndef add_exclusion_condition(statement, principal_to_remove):\\n    if\
        \ not statement['Effect'] == 'Deny':\\n        return statement\\n    if 'Condition'\
        \ in statement:\\n        if 'ArnNotEquals' in statement['Condition']:\\n\
        \            if 'aws:PrincipalArn' in statement['Condition']['ArnNotEquals']:\\\
        n                if isinstance(statement['Condition']['ArnNotEquals']['aws:PrincipalArn'],list)\
        \ and principal_to_remove not in statement['Condition']['ArnNotEquals']['aws:PrincipalArn']:\\\
        n                    statement['Condition']['ArnNotEquals']['aws:PrincipalArn'].append(principal_to_remove)\\\
        n                elif not principal_to_remove == statement['Condition']['ArnNotEquals']['aws:PrincipalArn']:\\\
        n                    statement['Condition']['ArnNotEquals']['aws:PrincipalArn']\
        \ = [statement['Condition']['ArnNotEquals']['aws:PrincipalArn'],principal_to_remove]\\\
        n            else:\\n                statement['Condition']['ArnNotEquals']['aws:PrincipalArn']\
        \ = principal_to_remove\\n        else:\\n            statement['Condition']['ArnNotEquals']\
        \ = {'aws:PrincipalArn': principal_to_remove}\\n    else:\\n        statement['Condition']\
        \ = {'ArnNotEquals': {'aws:PrincipalArn': principal_to_remove}}\\n    return\
        \ statement\\n\\ndef modify_policy(events, context):\\n    policy = json.loads(events['policy'])\\\
        n    policy['Statement'] = [add_exclusion_condition(stmt,events['principal_to_remove'])\
        \ for stmt in policy['Statement']]\\n    return {'ModifiedPolicy': json.dumps(policy)}\"\
        ,\n      \"InputPayload\" : {\n        \"policy\" : \"{{ getBucketPolicy.PolicyDocument\
        \ }}\",\n        \"principal_to_remove\" : \"{{ PrincipalToRemoveFromDenyPolicy\
        \ }}\"\n      }\n    },\n    \"outputs\" : [ {\n      \"Name\" : \"ModifiedPolicy\"\
        ,\n      \"Selector\" : \"$.Payload.ModifiedPolicy\",\n      \"Type\" : \"\
        String\"\n    } ]\n  }, {\n    \"description\" : \"Updates the bucket's resource-based\
        \ policy with the modified policy.\",\n    \"name\" : \"updateBucketPolicy\"\
        ,\n    \"action\" : \"aws:executeAwsApi\",\n    \"isEnd\" : true,\n    \"\
        inputs\" : {\n      \"Service\" : \"s3\",\n      \"Api\" : \"PutBucketPolicy\"\
        ,\n      \"Bucket\" : \"{{ BucketName }}\",\n      \"Policy\" : \"{{ modifyPolicy.ModifiedPolicy\
        \ }}\"\n    }\n  } ]\n}"
      Tags: []
      Name: "AWS-AttachExcludeConditionToS3DenyPolicies"
