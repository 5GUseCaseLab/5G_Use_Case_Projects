        \n    }\n  },\n  \"outputs\" : [ \"UpdateFunctionVPCConfiguration.Response\"\
        \ ],\n  \"mainSteps\" : [ {\n    \"name\" : \"UpdateFunctionVPCConfiguration\"\
        ,\n    \"action\" : \"aws:executeAwsApi\",\n    \"description\" : \"## UpdateFunctionVPCConfiguration\\\
        nMakes UpdateFunctionConfiguration API call using AWS Lambda function name\
        \ to update Amazon VPC Configuration i.e, SubnetIds and SecurityGroupIds.\\\
        n## Outputs\\n* Response: The standard response from the UpdateFunctionConfiguration\
        \ API call.\\n\",\n    \"timeoutSeconds\" : 600,\n    \"isEnd\" : false,\n\
        \    \"inputs\" : {\n      \"Service\" : \"lambda\",\n      \"Api\" : \"UpdateFunctionConfiguration\"\
        ,\n      \"FunctionName\" : \"{{FunctionName}}\",\n      \"VpcConfig\" : {\n\
