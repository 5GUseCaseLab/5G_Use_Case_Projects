        \"' ]; then\\n          bash \\\"'\\\"$ROLLBACK_PATH\\\"'\\\"\\n         \
        \ rm -f \\\"'\\\"$WATCHDOG_PID_FILE\\\"'\\\"\\n          exit 0\\n       \
        \ fi\\n      done\\n    ' &\\n    # Wait for watchdog to write its PID\\n\
        \    local WAIT_COUNT=0\\n    while [ ! -f \\\"$WATCHDOG_PID_FILE\\\" ] &&\
        \ [ $WAIT_COUNT -lt 10 ]; do\\n      sleep 0.1\\n      WAIT_COUNT=$((WAIT_COUNT\
        \ + 1))\\n    done\\n    if [ ! -f \\\"$WATCHDOG_PID_FILE\\\" ]; then\\n \
        \     echo \\\"ERROR: Rollback watchdog failed to start (PID file not created)\\\
        \"\\n      exit 1\\n    fi\\n    echo \\\"Rollback watchdog launched (PID:\
