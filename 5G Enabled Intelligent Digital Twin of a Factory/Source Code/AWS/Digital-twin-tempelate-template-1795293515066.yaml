        \n    },\n    \"SNSTopicArn\": {\n      \"type\": \"String\",\n      \"description\"\
        : \"(Required) The SNS topic ARN used to send pending approval notification\
        \ for instance restart. The SNS topic name must start with Automation.\"\n\
        \    },\n    \"AutomationAssumeRole\": {\n      \"type\": \"String\",\n  \
        \    \"description\": \"(Optional) The ARN of the role that allows Automation\
