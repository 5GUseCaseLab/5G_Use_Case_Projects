        $restored_hosts_file\\\" \\\"$mutated_hosts_file\\\"\\n      exit 1\\n   \
        \ fi\\n\\n    rm -f \\\"$restored_hosts_file\\\" \\\"$mutated_hosts_file\\\
        \"\\n    echo \\\"Hosts file restore completed successfully\\\"\\n  fi\\n\\\
        n  # Call status API before stop to verify the fault is still running\\n \
