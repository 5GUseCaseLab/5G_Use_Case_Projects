        \ \"Description\" : \"CIDR block for private subnet 2 located in Availability\
        \ Zone 2\",\n        \"Type\" : \"String\"\n      },\n      \"PrivateSubnet3CIDR\"\
        \ : {\n        \"AllowedPattern\" : \"^$|^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\\\
        \\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])(\\\\/([0-9]|[1-2][0-9]|3[0-2]))$\"\
        ,\n        \"Default\" : \"10.0.64.0/19\",\n        \"Description\" : \"CIDR\
        \ block for private subnet 3 located in Availability Zone 3\",\n        \"\
        Type\" : \"String\"\n      },\n      \"PublicSubnet1CIDR\" : {\n        \"\
        AllowedPattern\" : \"^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\\\\\
