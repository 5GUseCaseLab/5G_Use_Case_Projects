        \ IPs: ${PROTECTED_IPS[@]}\\\"\\n}\\n\\nvalidate_variable_is_set() {\\n  \
        \  local -r variable_name=\\\"$1\\\"\\n    local variable_value\\n\\n    eval\
        \ \\\"variable_value=\\\\\\\"\\\\${$variable_name-}\\\\\\\"\\\"\\n\\n    if\
