        n* ec2:DescribeInstances\\n* ec2:ModifyInstanceAttribute\\n* ec2:DescribeInstanceTypeOfferings\\\
        n* ec2:DescribeInstanceStatus\\n* iam:PassRole\\n\\n## Supports Rollback\\\
        nYes\\n\\n## Inputs\\n### EC2InstanceIdentifier:\\n* type: String\\n* description:\
        \ (Required) EC2 Instance Identifier\\n### EC2InstanceTargetInstanceType:\\\
        n* type: String\\n* description: (Optional) Override target InstanceType for\
        \ scale-up (default is to calculate the next instance type)\\n### AutomationAssumeRole:\\\
        n* type: String\\n* description: \\n    (Optional) The ARN of the role that\
        \ allows Automation to perform\\n    the actions on your behalf. If no role\
        \ is specified, Systems Manager Automation\\n    uses your IAM permissions\
        \ to run this document.\\n    default: ''\\n\\n## Details\\nThe document checks\
        \ that the instance is in an available state, then it fetches the original\
        \ instance type, calculates the next bigger instance type based on it (if\
        \ not specified), stops the instance,\\nvalidates that the instance is stopped,\
        \ upgrades the instance type based on the calculated one, starts the instance\
        \ again and validates that the instance is available again.\\n\\n## Steps\
        \ executed in normal flow\\n  * RecordStartTime\\n  * AssertInstanceInAvailableState\\\
        n  * DescribeEC2Instance\\n  * CalculateTargetType\\n  * StopEC2Instance\\\
        n  * ValidateInstanceIsStopped\\n  * ModifyInstanceAttribute\\n  * StartEC2Instance\\\
        n  * ValidateInstanceIsAvailable\\n  * AssertInstanceType\\n  * OutputRecoveryTime\\\
        n\\n## Outputs\\n* `TargetInstanceType`: The instance type after the scale-up\\\
        n* `OutputRecoveryTime.RecoveryTime`: recovery time in seconds\",\n  \"schemaVersion\"\
        \ : \"0.3\",\n  \"assumeRole\" : \"{{ AutomationAssumeRole }}\",\n  \"outputs\"\
        \ : [ \"OutputRecoveryTime.RecoveryTime\", \"CalculateTargetType.TargetInstanceType\"\
        \ ],\n  \"parameters\" : {\n    \"EC2InstanceIdentifier\" : {\n      \"type\"\
        \ : \"String\",\n      \"allowedPattern\" : \"^i-[0-9a-f]{8,17}$\",\n    \
        \  \"description\" : \"(Required) EC2InstanceIdentifier\"\n    },\n    \"\
        EC2InstanceTargetInstanceType\" : {\n      \"type\" : \"String\",\n      \"\
        allowedPattern\" : \"^[0-9a-zA-Z.\\\\-_/:]+$\",\n      \"description\" : \"\
        (Optional) EC2InstanceTargetInstanceType\",\n      \"default\" : \"\"\n  \
        \  },\n    \"AutomationAssumeRole\" : {\n      \"type\" : \"String\",\n  \
        \    \"allowedPattern\" : \"^[0-9a-zA-Z.\\\\-_/:]+$\",\n      \"description\"\
        \ : \"(Required) The ARN of the role that allows Automation to perform the\
        \ actions on your behalf.\"\n    }\n  },\n  \"mainSteps\" : [ {\n    \"name\"\
        \ : \"RecordStartTime\",\n    \"description\" : \"Start recording execution\
        \ time\",\n    \"action\" : \"aws:executeScript\",\n    \"outputs\" : [ {\n\
        \      \"Name\" : \"StartTime\",\n      \"Selector\" : \"$.Payload\",\n  \
        \    \"Type\" : \"String\"\n    } ],\n    \"inputs\" : {\n      \"Runtime\"\
        \ : \"python3.11\",\n      \"Handler\" : \"start_time\",\n      \"Script\"\
        \ : \"import logging\\nimport time\\nfrom datetime import datetime, timezone\\\
        n\\nimport boto3\\nfrom botocore.exceptions import ClientError\\nfrom dateutil\
        \ import parser\\n\\nlogger = logging.getLogger()\\nlogger.setLevel(logging.INFO)\\\
        n\\n\\n\\ndef start_time(events, context):\\n    return datetime.now(timezone.utc).isoformat()\"\
        \n    }\n  }, {\n    \"name\" : \"AssertInstanceInAvailableState\",\n    \"\
        description\" : \"Assert that the Amazon EC2 instance is available.\",\n \
        \   \"action\" : \"aws:assertAwsResourceProperty\",\n    \"onFailure\" : \"\
