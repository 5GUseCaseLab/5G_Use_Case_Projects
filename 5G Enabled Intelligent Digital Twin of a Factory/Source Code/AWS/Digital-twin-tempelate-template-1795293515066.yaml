        \      \"Description\" : \"Fully qualified domain name (FQDN) of the forest\
        \ root domain e.g. example.com\",\n        \"MaxLength\" : \"64\",\n     \
        \   \"MinLength\" : \"2\",\n        \"Type\" : \"String\"\n      },\n    \
        \  \"DomainNetBIOSName\" : {\n        \"AllowedPattern\" : \"^[a-zA-Z0-9]+$\"\
        ,\n        \"Default\" : \"example\",\n        \"Description\" : \"NetBIOS\
