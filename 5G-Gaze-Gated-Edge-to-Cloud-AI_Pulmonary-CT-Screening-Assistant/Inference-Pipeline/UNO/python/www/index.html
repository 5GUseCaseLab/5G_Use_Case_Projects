<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pulmonary AI Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a;
            --panel-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --danger: #ef4444;
            --success: #10b981;
            --border: #334155;
        }
        body { 
            font-family: 'Inter', sans-serif; 
            margin: 0; 
            background-color: var(--bg-dark); 
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        header {
            background-color: var(--panel-bg);
            padding: 15px 30px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header h1 { margin: 0; font-size: 1.5rem; letter-spacing: 0.5px; }
        .status-badge {
            background-color: #334155;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
        }
        main {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        .canvas-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-color: #000;
            overflow: auto;
        }
        canvas { 
            max-width: 100%; 
            max-height: 100%; 
            object-fit: contain;
            cursor: crosshair; 
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        aside {
            width: 350px;
            background-color: var(--panel-bg);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
        }
        .controls, .results { padding: 20px; border-bottom: 1px solid var(--border); }
        .results { flex: 1; overflow-y: auto; }
        h2 { font-size: 1.1rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-top: 0; }
        
        /* Custom File Upload */
        /* Custom File Upload */
        input[type="file"] { display: none; }
        .file-upload-btn {
            display: block; 
            width: 100%; 
            box-sizing: border-box; /* Keeps it from overflowing */
            text-align: center;a
            background-color: var(--accent); 
            color: white;
            padding: 10px; /* Matched to buttons */
            border: 1px solid var(--accent); /* Matched border math */
            border-radius: 6px; 
            cursor: pointer;
            font-size: 13.333px; /* Forces exact font match with standard buttons */
            font-weight: 600; 
            margin-bottom: 20px; /* Gives a nice gap before the toggle buttons */
            transition: background 0.2s;
        }
        .file-upload-btn:hover { 
            background-color: var(--accent-hover); 
            border-color: var(--accent-hover);
        }
        
        button {
            width: 100%; 
            box-sizing: border-box; 
            background-color: transparent; 
            color: var(--text-main);
            border: 1px solid var(--border); 
            padding: 10px; /* Matched to upload button */
            margin-bottom: 10px;
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: 600; 
            transition: all 0.2s;
        }
        button:hover { background-color: #334155; border-color: var(--text-muted); }
        button.active { background-color: var(--accent); border-color: var(--accent); color: white; }

        /* Tier 1 Results Styling */
        #panel p { line-height: 1.5; font-size: 0.95rem; }
        .attr-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #334155; font-size: 0.9rem;}
        .attr-key { color: var(--text-muted); }
        .attr-val { font-weight: 600; text-align: right;}
        .narrative-box { background: rgba(59, 130, 246, 0.1); border-left: 4px solid var(--accent); padding: 12px; margin-top: 15px; border-radius: 0 4px 4px 0;}
    </style>
</head>
<body>
    <header>
        <h1>Pulmonary AI Assistant</h1>
        <div id="status" class="status-badge">System Idle</div>
    </header>

    <main>
        <div class="canvas-container">
            <canvas id="cv"></canvas>
        </div>

        <aside>
            <div class="controls">
                <h2>Controls</h2>
                <label class="file-upload-btn">
                    Upload CT Scan
                    <input type="file" id="file" accept="image/png, image/jpeg">
                </label>
                
                <button id="heat" class="active">Toggle Heatmap (H)</button>
                <button id="attn">Toggle Eye-Tracking (A)</button>
                <button id="reset">Reset Gaze Tracker</button>
            </div>
            
            <div class="results">
                <h2>Clinical Analysis</h2>
                <div id="panel">
                    <p style="color: #94a3b8; text-align: center; margin-top: 50px;">
                        Upload a scan and click on an AI bounding box to generate a Tier 1 medical report.
                    </p>
                </div>
            </div>
        </aside>
    </main>

    <!-- Hidden inputs for legacy gaze tracking math -->
    <input type="hidden" id="radius" value="50">
    <input type="hidden" id="mindwell" value="100">

    <script>
        if (typeof Coverage === 'undefined') {
            window.Coverage = {
                create: (w, h, c) => ({ w, h, cell: c, rows: Math.ceil(h/c), cols: Math.ceil(w/c), grid: new Float32Array(Math.ceil(h/c)*Math.ceil(w/c)) }),
                screenToImage: (sx, sy, rect, w, h) => [(sx - rect.left) * (w / rect.width), (sy - rect.top) * (h / rect.height)],
                sample: () => {}, flag: () => ({})
            };
        }
    </script>
    <script src="viewer.js"></script>
</body>
</html>
